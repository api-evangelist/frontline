openapi: 3.2.0
info:
  title: Public Users API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Users
  description: List account users to resolve IDs for relations and assignment
paths:
  /public/v1/users:
    get:
      summary: List account users
      operationId: listUsers
      description: Lists the users in your account. Use to resolve user IDs for user-relation fields and task assignment. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserList'
components:
  schemas:
    PublicUserList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicUser'
      required:
      - results
    PublicUser:
      type: object
      properties:
        id:
          type: number
          example: 12
        first_name:
          type:
          - string
          - 'null'
          example: example
        last_name:
          type:
          - string
          - 'null'
          example: example
        full_name:
          type:
          - string
          - 'null'
          example: example
        email:
          type:
          - string
          - 'null'
          example: example
        avatar:
          type:
          - string
          - 'null'
          example: example
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - USER
          example: OWNER
        status:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - INVITED
          - ONBOARDING
          example: ACTIVE
      required:
      - id
      - role
      - status
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
