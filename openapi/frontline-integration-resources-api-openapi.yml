          type:
          - number
          - 'null'
          example: 1
        required: false
        name: connectedAccountId
        in: query
      responses:
        '200':
          description: Gmail labels
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: example
                        name:
                          type: string
                          example: example
                        type:
                          type: string
                          enum:
