openapi: 3.2.0
info:
  title: Public Billing API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Billing
  description: View billing plan details, credits, and renewal information
paths:
  /public/v1/billing:
    get:
      summary: Get billing plan details
      operationId: getBillingPlan
      description: Returns billing plan information including plan name, credits per month, credits used, and subscription renewal date.
      security:
      - accountApiKey: []
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Billing plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlan'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/usage:
    get:
      summary: Get Studio usage details
      operationId: getStudioUsage
      description: 'Returns Studio (account-level) usage: credits used vs limit, counts of agents, workflows, flows, users and knowledge bases, current plan, subscription details, and upcoming plan changes. Requires a USER API key.'
      security:
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Studio usage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStudioUsage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/credits/history:
    get:
      summary: Get credit consumption history
      operationId: getCreditHistory
      description: Returns daily credit consumption broken down by AI model. Optionally filter with start_date and end_date (ISO dates).
      security:
      - accountApiKey: []
      - userApiKey: []
      tags:
      - Billing
      parameters:
      - schema:
          type:
          - string
          - 'null'
          example: '2026-05-01'
        required: false
        name: start_date
        in: query
      - schema:
          type:
          - string
          - 'null'
          example: '2026-05-31'
        required: false
        name: end_date
        in: query
      responses:
        '200':
          description: Credit history grouped by date and model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCreditHistory'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/max/usage:
    get:
      summary: Get Max usage details
      operationId: getMaxUsage
      description: 'Returns the account''s Max subscription state: the current plan and its features, renewal and status, seat and add-on license pools with how many of each are assigned, pricing, feature limits, and any scheduled plan change. Requires a USER API key belonging to an OWNER or ADMIN.'
      security:
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Max usage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaxUsage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an OWNER or ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/max/plans:
    get:
      summary: List Max plans
      operationId: getMaxPlans
      description: Returns the Max plans that can be bought, with their prices. Requires a USER API key belonging to an OWNER or ADMIN.
      security:
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Max plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaxPlanList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an OWNER or ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/max/catalog:
    get:
      summary: Get the Max catalog
      operationId: getMaxCatalog
      description: 'Returns everything Max sells: plans, capability add-ons and additional credit bags, with their prices. Requires a USER API key belonging to an OWNER or ADMIN.'
      security:
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Max catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaxCatalog'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an OWNER or ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/max/seats/matrix:
    get:
      summary: Get the Max seat and license assignment matrix
      operationId: getMaxSeatMatrix
      description: 'Returns one row per account user showing whether they hold a Max seat and which capability licenses they hold — `MAX_MEETINGS` for the notetaker and `MAX_EMAIL_AGENT` for inbox labeling, drafting and follow-ups — plus the purchased-versus-assigned pool counters. This is the read side of `PUT /billing/max/assignments`: read the matrix, change the sets you care about, then write the whole thing back. Requires a USER API key belonging to an OWNER or ADMIN.'
      security:
      - userApiKey: []
      tags:
      - Billing
      responses:
        '200':
          description: Seat and license matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaxSeatMatrix'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an OWNER or ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/billing/max/assignments:
    put:
      summary: Set Max seat and license assignments
      operationId: setMaxAssignments
      description: Declaratively saves who holds a Max seat and who holds each capability license. `seatUserIds` is the complete set of seat holders, so any user left out loses their seat. Inside `licenses`, an omitted capability is left untouched while an explicit empty array revokes it for everyone. This only moves already-purchased seats and licenses between users; to change how many you pay for, use the cart. Returns the updated matrix. Requires a USER API key belonging to an OWNER or ADMIN.
      security:
      - userApiKey: []
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicMaxAssignmentsInput'
      responses:
        '200':
          description: Updated seat and license matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMaxSeatMatrix'
        '400':
          description: Bad Request (more seats or licenses assigned than purchased, or a license given to a user without a seat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not an OWNER or ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PublicMaxPrice:
      type: object
      properties:
        stripePriceId:
          type:
          - string
          - 'null'
          example: price_1QabcXYZ
        interval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
          example: MONTHLY
        amount:
          type:
          - number
          - 'null'
          example: 49
        currency:
          type: string
          example: usd
        internalKey:
          type: string
          description: Price key accepted by the cart.
          example: max_premium_monthly
        isLegacy:
          type: boolean
          description: Legacy prices only appear to accounts already paying for them.
          example: false
      required:
      - stripePriceId
      - interval
      - amount
      - currency
      - internalKey
      - isLegacy
    PublicMaxCreditBag:
      type: object
      properties:
        stripePriceId:
          type: string
          example: price_1QcreditXYZ
        interval:
          type: string
          enum:
          - MONTHLY
          - ANNUAL
          example: MONTHLY
        amount:
          type: number
          example: 10
        currency:
          type: string
          example: usd
        credits:
          type: number
          example: 1000
        internalKey:
          type: string
          example: max_additional_credits_1000
      required:
      - stripePriceId
      - interval
      - amount
      - currency
      - credits
      - internalKey
    PublicMaxPlan:
      type: object
      properties:
        id:
          type: number
          example: 3
        name:
          type: string
          example: Max Premium
        description:
          type:
          - string
          - 'null'
          example: example
        featuresEnabled:
          type: object
        isLegacy:
          type: boolean
          example: false
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxPrice'
      required:
      - id
      - name
      - isLegacy
      - prices
    PublicMaxAssignmentsInput:
      type: object
      properties:
        seatUserIds:
          type: array
          items:
            type: integer
            minimum: 1
            example: 1
          description: The complete set of users who should hold a Max seat. Users omitted here lose their seat.
          example:
          - 12
          - 13
        licenses:
          type: object
          description: Per capability, the complete set of seat holders who should hold that license. An omitted capability is left untouched; an explicit empty array revokes it for everyone.
          example:
            MAX_MEETINGS:
            - 12
            MAX_EMAIL_AGENT:
            - 12
            - 13
      required:
      - seatUserIds
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    BillingPlan:
      type: object
      properties:
        planName:
          type:
          - string
          - 'null'
          example: Professional
        creditsPerMonth:
          type:
          - number
          - 'null'
          example: 5000
        creditsUsed:
          type: number
          example: 1250.5
        subscriptionRenews:
          type:
          - string
          - 'null'
          example: '2026-03-25T00:00:00Z'
      required:
      - planName
      - creditsPerMonth
      - creditsUsed
      - subscriptionRenews
    PublicCreditHistoryItem:
      type: object
      properties:
        date:
          type: string
          example: '2026-05-12'
        aiModelId:
          type:
          - number
          - 'null'
          example: 1
        model:
          type:
          - string
          - 'null'
          example: gpt-4o
        modelName:
          type:
          - string
          - 'null'
          example: GPT-4o
        analyticsColor:
          type:
          - string
          - 'null'
          example: example
        totalCredits:
          type: number
          example: 42.5
        messageCount:
          type: number
          example: 120
      required:
      - date
      - totalCredits
      - messageCount
    PublicMaxSeatMatrixRow:
      type: object
      properties:
        userId:
          type: number
          example: 12
        firstName:
          type:
          - string
          - 'null'
          example: Jane
        lastName:
          type:
          - string
          - 'null'
          example: Doe
        email:
          type:
          - string
          - 'null'
          example: jane@acme.com
        avatar:
          type:
          - string
          - 'null'
          example: example
        role:
          type:
          - string
          - 'null'
          example: ADMIN
        hasSeat:
          type: boolean
          example: true
        canHoldLicenses:
          type: boolean
          description: False when the user has no Max seat, since a license needs a live seat.
          example: true
        licenses:
          type: object
          description: Capability key to whether this user currently holds that license.
          example:
            MAX_MEETINGS: true
            MAX_EMAIL_AGENT: false
      required:
      - userId
      - hasSeat
      - canHoldLicenses
      - licenses
    PublicMaxSeatMatrix:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxSeatMatrixRow'
        pools:
          type: object
          description: Purchased vs assigned counts, keyed by `seats` for the plan and by capability for add-ons.
          example:
            seats:
              total: 3
              assigned: 2
            MAX_MEETINGS:
              total: 2
              assigned: 1
            MAX_EMAIL_AGENT:
              total: 3
              assigned: 2
      required:
      - rows
      - pools
    PublicMaxCatalog:
      type: object
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxPlan'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxAddon'
        additionalCredits:
          type:
          - object
          - 'null'
          properties:
            name:
              type: string
              example: example
            description:
              type:
              - string
              - 'null'
              example: example
            bags:
              type: array
              items:
                $ref: '#/components/schemas/PublicMaxCreditBag'
          required:
          - name
          - bags
      required:
      - plans
      - addons
      - additionalCredits
    PublicMaxAddon:
      type: object
      properties:
        capability:
          type: string
          enum:
          - MAX_PLAN
          - MAX_MEETINGS
          - MAX_EMAIL_AGENT
          - MAX_ADDITIONAL_CREDITS
          example: MAX_MEETINGS
        name:
          type: string
          example: Meeting Intelligence
        description:
          type:
          - string
          - 'null'
          example: example
        isLegacy:
          type: boolean
          example: false
        prices:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxPrice'
      required:
      - capability
      - name
      - isLegacy
      - prices
    PublicCreditHistory:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicCreditHistoryItem'
      required:
      - results
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
    PublicStudioUsage:
      type: object
      properties:
        usage:
          type:
          - object
          - 'null'
          additionalProperties: {}
        plan:
          type:
          - object
          - 'null'
          additionalProperties: {}
        subscription:
          type:
          - object
          - 'null'
          additionalProperties: {}
        limits:
          type:
          - object
          - 'null'
          additionalProperties: {}
        campaignEmailCredits:
          type:
          - object
          - 'null'
          additionalProperties: {}
        next:
          type:
          - object
          - 'null'
          additionalProperties: {}
    PublicMaxPlanList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicMaxPlan'
      required:
      - results
    PublicMaxUsage:
      type: object
      properties:
        plan:
          type:
          - object
          - 'null'
          additionalProperties: {}
        subscription:
          type:
          - object
          - 'null'
          additionalProperties: {}
        seats:
          type:
          - object
          - 'null'
          additionalProperties: {}
        pricing:
          type:
          - object
          - 'null'
          additionalProperties: {}
        addons:
          type:
          - object
          - 'null'
          additionalProperties: {}
        limits:
          type:
          - object
          - 'null'
          additionalProperties: {}
        next:
          type:
          - object
          - 'null'
          additionalProperties: {}
        additionalCredits:
          type:
          - object
          - 'null'
          properties:
            limit:
              type: number
              example: 1
            spent:
              type: number
              example: 1
          required:
          - limit
          - spent
        userCredits:
          type:
          - object
          - 'null'
          properties:
            limit:
              type: number
              example: 1
            spent:
              type: number
              example: 1
            available:
              type: number
              example: 1
            additionalLimit:
              type:
              - number
              - 'null'
              example: 1
            additionalSpent:
              type: number
              example: 1
          required:
          - limit
          - spent
          - available
          - additionalLimit
          - additionalSpent
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
