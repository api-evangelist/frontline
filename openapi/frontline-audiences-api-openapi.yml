        '200':
          description: Audience export file
          headers:
            X-Total-Count:
              description: Number of audience members in the export
              schema:
                type: integer
                example: 1
            X-Audience-Truncated:
              description: Whether the audience exceeded the maximum size and was truncated
              schema:
                type: boolean
                example: false
          content:
            text/csv:
              schema:
                type: string
                format: binary
                example: example
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: A USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient campaign or audience permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Audience resolution is not completed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
