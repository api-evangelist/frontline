  /public/v1/audiences/{audienceId}/exports:
    post:
      summary: Download an audience export
      description: Streams the audience's resolved members as CSV. Returns 409 with the resolution status while the audience is still resolving; poll `GET /audiences/{audienceId}/preview` until `resolution.status` is `COMPLETED` and retry. `fresh=true` discards the cached resolution and starts a new one (returns 409 until it completes; retry without `fresh`).
