        in: path
      - schema:
          anyOf:
          - type: boolean
            enum:
            - true
            example: true
          - type: boolean
            enum:
            - false
            example: false
          - type: string
            enum:
            - 'true'
            example: 'true'
          - type: string
            enum:
            - 'false'
            example: 'false'
        required: false
        name: fresh
        in: query
