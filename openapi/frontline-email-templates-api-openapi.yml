      tags:
      - Email Templates
      parameters:
      - schema:
          type: number
          default: 20
          example: 1
        required: false
        name: pageSize
        in: query
      - schema:
          type: number
          default: 1
          example: 1
        required: false
        name: pageNum
        in: query
      - schema:
          anyOf:
          - type:
            - number
            - 'null'
            example: 1
          - type: string
            example: example
          - type:
            - object
            - 'null'
        required: false
        name: cursor
        in: query
      - schema:
          type: string
          minLength: 1
          example: example
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          example: ACTIVE
        required: false
        name: status
        in: query
      - schema:
          type:
          - boolean
          - 'null'
          example: false
        required: false
        name: includeArchived
        in: query
      responses:
        '200':
          description: Paginated email templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                    example: 1
                  pageSize:
                    type: number
                    example: 1
                  pageNum:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 1
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                        name:
                          type: string
                          example: example
                        description:
                          type:
                          - string
                          - 'null'
                          example: example
                        subject:
                          type: string
                          example: example
                        bodyText:
                          type: string
                          example: example
                        contentHash:
                          type: string
                          example: example
                        status:
                          type: string
                          enum:
                          - ACTIVE
                          - ARCHIVED
                          example: ACTIVE
                        version:
                          type: number
                          example: 1
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          example: example
                        createdAt:
                          type:
                          - string
                          - 'null'
                          example: example
                        createdBy:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: number
                              example: 1
                            firstName:
                              type: string
                              example: example
                            lastName:
                              type: string
                              example: example
                            email:
                              type: string
                              format: email
                              example: user@example.com
                            avatar:
                              type:
                              - string
                              - 'null'
                              example: example
                          required:
                          - id
                          - firstName
                          - lastName
                          - email
                        updatedBy:
                          type:
                          - object
                          - 'null'
                          properties:
