  /public/v1/email-templates/{templateId}/patch:
    post:
      summary: Patch email template
      operationId: patchEmailTemplate
      description: Applies a focused list of operations. `expectedVersion` is required; a mismatch returns 409 with the current version and document.
      security:
      - bearerAuth: []
      tags:
      - Email Templates
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 1
        required: true
        name: templateId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                  example: 1
                operations:
                  type: array
                  items:
                    oneOf:
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - SET_NAME
                          example: SET_NAME
                        name:
                          type: string
                          minLength: 1
                          maxLength: 200
                          example: example
                      required:
                      - op
                      - name
                      additionalProperties: false
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - SET_SUBJECT
                          example: SET_SUBJECT
                        subject:
                          type: string
                          minLength: 1
                          maxLength: 500
                          example: example
                      required:
                      - op
                      - subject
                      additionalProperties: false
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - REPLACE_BLOCK
                          example: REPLACE_BLOCK
                        blockId:
                          type: string
                          minLength: 1
                          example: example
                        block:
                          type: object
                          additionalProperties: {}
                      required:
                      - op
                      - blockId
                      - block
                      additionalProperties: false
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - INSERT_BLOCK_AFTER
                          example: INSERT_BLOCK_AFTER
                        afterBlockId:
                          type:
                          - string
                          - 'null'
                          minLength: 1
                          example: example
                        block:
                          type: object
                          additionalProperties: {}
                      required:
                      - op
                      - afterBlockId
                      - block
                      additionalProperties: false
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - DELETE_BLOCK
                          example: DELETE_BLOCK
                        blockId:
                          type: string
                          minLength: 1
                          example: example
                      required:
                      - op
                      - blockId
                      additionalProperties: false
                    - type: object
                      properties:
                        op:
                          type: string
                          enum:
                          - REPLACE_DOCUMENT
                          example: REPLACE_DOCUMENT
                        document:
                          type:
                          - object
                          - 'null'
                      required:
                      - op
                      additionalProperties: false
                  minItems: 1
                  maxItems: 50
              required:
              - expectedVersion
              - operations
              additionalProperties: false
      responses:
        '200':
          description: Template patched
