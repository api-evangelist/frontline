openapi: 3.2.0
info:
  title: Public Account API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Account
  description: Inspect the identity attached to the current API key
paths:
  /public/v1/me:
    get:
      summary: Get current identity
      operationId: getMe
      description: Returns the account and (for USER keys) user attached to the API key. Use this to validate a key and inspect the calling identity.
      security:
      - bearerAuth: []
      tags:
      - Account
      responses:
        '200':
          description: Identity attached to the API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/account/sequence-settings:
    get:
      summary: Get the account's sequence delivery settings
      operationId: getAccountSequenceSettings
      description: 'Returns the account-level Sequence settings: allowMultipleActiveSequences, maxConcurrentActiveSequences, the account''s defaultDeliveryWindow override (null if never set), accountTimezone, effectiveDeliveryWindow — the window actually applied when a Sequence''s own `deliveryWindow` is null (defaultDeliveryWindow, or the hardcoded Mon-Fri 09:00-17:00 fallback) — and enrollOnBehalfPolicy, which governs the enroll and enroll-bulk endpoints'' `enrollerUserId` field. Use this before assuming `deliveryWindow: null` on a Sequence means unrestricted / 24-7 delivery — it does not. Requires a USER API key belonging to an OWNER or ADMIN.'
      security:
      - userApiKey: []
      tags:
      - Account
      responses:
        '200':
          description: Account Sequence settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSequenceSettings'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sequence settings not found, or caller is not an OWNER/ADMIN of the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    AccountSequenceSettings:
      type: object
      properties:
        allowMultipleActiveSequences:
          type: boolean
          example: false
        maxConcurrentActiveSequences:
          type:
          - integer
          - 'null'
          minimum: 1
          example: null
        defaultDeliveryWindow:
          type:
          - object
          - 'null'
          properties:
            startTime:
              type: string
              pattern: ^([01]\d|2[0-3]):([0-5]\d)$
            endTime:
              type: string
              pattern: ^([01]\d|2[0-3]):([0-5]\d)$
            allowedWeekdays:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
                example: 1
              minItems: 1
          required:
          - startTime
          - endTime
          - allowedWeekdays
          example: null
        accountTimezone:
          type: string
          example: America/Argentina/Buenos_Aires
        effectiveDeliveryWindow:
          type: object
          properties:
            startTime:
              type: string
              pattern: ^([01]\d|2[0-3]):([0-5]\d)$
            endTime:
              type: string
              pattern: ^([01]\d|2[0-3]):([0-5]\d)$
            allowedWeekdays:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
                example: 1
              minItems: 1
          required:
          - startTime
          - endTime
          - allowedWeekdays
          example:
            startTime: 09:00
            endTime: '17:00'
            allowedWeekdays:
            - 1
            - 2
            - 3
            - 4
            - 5
        enrollOnBehalfPolicy:
          type: string
          enum:
          - NONE
          - ADMINS_AND_OWNERS
          - ALL_USERS
          example: NONE
      required:
      - allowMultipleActiveSequences
      - maxConcurrentActiveSequences
      - defaultDeliveryWindow
      - accountTimezone
      - effectiveDeliveryWindow
      - enrollOnBehalfPolicy
    Me:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - true
          example: true
        data:
          type: object
          properties:
            account:
              type:
              - object
              - 'null'
              properties:
                id:
                  type: number
                  example: 1234
                name:
                  type: string
                  example: Acme Inc.
                namespace:
                  type: string
                  example: acme
              required:
              - id
              - name
              - namespace
            user:
              type:
              - object
              - 'null'
              properties:
                id:
                  type: number
                  example: 56
                email:
                  type: string
                  example: you@acme.com
              required:
              - id
              - email
              description: Null for GENERAL API keys; populated for USER keys.
          required:
          - account
          - user
      required:
      - ok
      - data
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
