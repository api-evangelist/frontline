                    default: []
                required:
                - type
                description: 'Deterministic variable deserializer, no AI, no credits. Reads sourceVariableName and writes each mappings[].path (dot notation with optional indices; empty path maps the whole value) into an existing destination variable. parseMode controls how the source is interpreted: AUTO (default) parses it when it''s a JSON string and falls back to the raw value on invalid JSON, FORCE parses it and fails the node on invalid JSON, RAW never parses (applies only to the source container, never to individual mapping values). onMissing controls unresolved, non-required paths: SKIP leaves the destination untouched, SET_EMPTY writes an empty string. A required mapping that fails to resolve fails the whole node. Single outgoing handle.'
