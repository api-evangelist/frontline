            description: 'Deterministic variable deserializer, no AI, no credits. Reads sourceVariableName and writes each mappings[].path (dot notation with optional indices; empty path maps the whole value) into an existing destination variable. parseMode controls how the source is interpreted: AUTO (default) parses it when it''s a JSON string and falls back to the raw value on invalid JSON, FORCE parses it and fails the node on invalid JSON, RAW never parses (applies only to the source container, never to individual mapping values). onMissing controls unresolved, non-required paths: SKIP leaves the destination untouched, SET_EMPTY writes an empty string. A required mapping that fails to resolve fails the whole node. Single outgoing handle.'
          - type: object
            properties:
              type:
                type: string
                enum:
                - CONDITION
                example: CONDITION
              branches:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      example: example
                    name:
                      type: string
                      minLength: 1
                      example: example
                    handleId:
                      type: string
                      minLength: 1
                      example: example
                    conditionGroup:
                      type: object
                      properties:
                        operator:
                          type: string
                          enum:
                          - and
                          - or
                          example: and
                        conditions:
                          type: array
                          items:
                            type: object
                  required:
                  - id
                  - name
                  - handleId
                  - conditionGroup
                maxItems: 5
                default: []
              elseBranch:
                type: object
                properties:
                  handleId:
                    type: string
                    minLength: 1
                    example: example
                  name:
                    type: string
                    minLength: 1
                    example: example
                required:
                - name
            required:
            - type
            - elseBranch
            description: 'Deterministic branching node, no AI, no credits. Evaluates branches[] in order and routes to the first one whose conditionGroup matches, or to elseBranch if none match. Each branch has its own outgoing handleId; an unconnected handle simply ends that path. conditionGroup is a recursive and/or tree of leaf rules { variableName, path, operator, value, valueType }: path (optional, dot notation with indices) reads into the variable''s value; valueType INPUT uses value as a literal, VARIABLE resolves value as another variable''s name (+ its own path resolution is not supported on the right-hand side), EMPTY ignores value. Same comparison semantics as SEQUENCE_CONDITION.'
          - type:
            - object
            - 'null'
      additionalProperties: false
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
