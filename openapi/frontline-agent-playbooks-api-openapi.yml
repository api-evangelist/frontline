openapi: 3.2.0
info:
  title: Public Agent Playbooks API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Agent Playbooks
  description: Manage reusable instruction sets assigned to agents
paths:
  /public/v1/playbooks:
    get:
      summary: List agent playbooks
      operationId: listAgentPlaybooks
      description: Lists reusable agent playbooks (instruction sets) visible to the caller. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: boolean
          example: false
        required: false
        name: isActive
        in: query
      - schema:
          type: string
          example: example
        required: false
        name: filterText
        in: query
      - schema:
          type: string
          enum:
          - PRIVATE
          - ACCOUNT
          example: PRIVATE
        required: false
        name: visibility
        in: query
      responses:
        '200':
          description: Paginated playbooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybookList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create agent playbook
      operationId: createAgentPlaybook
      description: Creates a reusable agent playbook. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAgentPlaybookCreateInput'
      responses:
        '201':
          description: Created playbook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybook'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/playbooks/{playbookId}:
    get:
      summary: Get agent playbook details
      operationId: getAgentPlaybook
      description: Returns an agent playbook by ID. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 42
        required: true
        name: playbookId
        in: path
      responses:
        '200':
          description: Playbook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybook'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update agent playbook
      operationId: updateAgentPlaybook
      description: Updates an agent playbook. Only the creator (or an OWNER/ADMIN) can update it. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 42
        required: true
        name: playbookId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAgentPlaybookUpdateInput'
      responses:
        '200':
          description: Updated playbook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybook'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete agent playbook
      operationId: deleteAgentPlaybook
      description: Deletes an agent playbook. Only the creator can delete it. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 42
        required: true
        name: playbookId
        in: path
      responses:
        '200':
          description: Playbook deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybookDeleteResult'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/agents/{agentId}/playbooks:
    get:
      summary: List playbooks assigned to an agent
      operationId: listAssignedAgentPlaybooks
      description: Lists playbooks assigned to a specific agent. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: string
          example: uuid-xxxx-xxxx
        required: true
        name: agentId
        in: path
      - schema:
          type: boolean
          example: false
        required: false
        name: isActive
        in: query
      - schema:
          type: string
          example: example
        required: false
        name: filterText
        in: query
      - schema:
          type: string
          enum:
          - PRIVATE
          - ACCOUNT
          example: PRIVATE
        required: false
        name: visibility
        in: query
      responses:
        '200':
          description: Paginated assigned playbooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybookList'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Assign playbooks to an agent
      operationId: assignAgentPlaybooks
      description: Sets the full list of playbooks assigned to an agent (replaces existing assignments). Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Playbooks
      parameters:
      - schema:
          type: string
          example: uuid-xxxx-xxxx
        required: true
        name: agentId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicAgentPlaybookAssignInput'
      responses:
        '200':
          description: Updated assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAgentPlaybookList'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PublicAgentPlaybookAssignInput:
      type: object
      properties:
        playbookIds:
          type: array
          items:
            type: integer
            minimum: 1
            example: 1
          example:
          - 1
          - 2
      required:
      - playbookIds
    PublicAgentPlaybookUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: example
        description:
          type: string
          minLength: 10
          maxLength: 750
          example: example value
        instructions:
          type: string
          minLength: 10
          maxLength: 10000
          example: example value
        tools:
          type: array
          items:
            type: string
            example: example
          maxItems: 20
        visibility:
          type: string
          enum:
          - PRIVATE
          - ACCOUNT
          example: PRIVATE
        isActive:
          type: boolean
          example: false
        connectedAccountConfigs:
          type: array
          items:
            type: object
            properties:
              connectedAccountId:
                type: number
                example: 1
              useAllTools:
                type: boolean
                default: true
                example: false
              selectedToolSlugs:
                type:
                - array
                - 'null'
                items:
                  type: string
                  example: example
            required:
            - connectedAccountId
        selectedRecordTypes:
          type: array
          items:
            type: object
            properties:
              recordTypeId:
                type: number
                example: 1
              read:
                type: boolean
                example: false
              create:
                type: boolean
                example: false
              update:
                type: boolean
                example: false
              delete:
                type: boolean
                example: false
              createActivity:
                type: boolean
                example: false
            required:
            - recordTypeId
        selectedCustomTools:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: 1
                example: 1
              enabled:
                type: boolean
                default: true
                example: false
            required:
            - id
    PublicAgentPlaybookDeleteResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
      - success
    PublicAgentPlaybookCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: example
        description:
          type: string
          minLength: 10
          maxLength: 750
          example: example value
        instructions:
          type: string
          minLength: 10
          maxLength: 10000
          example: example value
        tools:
          type: array
          items:
            type: string
            example: example
          maxItems: 20
          default: []
        visibility:
          type: string
          enum:
          - PRIVATE
          - ACCOUNT
          default: ACCOUNT
          example: PRIVATE
        isActive:
          type: boolean
          default: true
          example: false
        connectedAccountConfigs:
          type: array
          items:
            type: object
            properties:
              connectedAccountId:
                type: number
                example: 1
              useAllTools:
                type: boolean
                default: true
                example: false
              selectedToolSlugs:
                type:
                - array
                - 'null'
                items:
                  type: string
                  example: example
            required:
            - connectedAccountId
        selectedRecordTypes:
          type: array
          items:
            type: object
            properties:
              recordTypeId:
                type: number
                example: 1
              read:
                type: boolean
                example: false
              create:
                type: boolean
                example: false
              update:
                type: boolean
                example: false
              delete:
                type: boolean
                example: false
              createActivity:
                type: boolean
                example: false
            required:
            - recordTypeId
        selectedCustomTools:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: 1
                example: 1
              enabled:
                type: boolean
                default: true
                example: false
            required:
            - id
      required:
      - name
      - description
      - instructions
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
    PublicAgentPlaybook:
      type: object
      properties:
        id:
          type: number
          example: 1
        name:
          type: string
          example: example
        description:
          type: string
          example: example
        isActive:
          type: boolean
          example: false
        instructions:
          type: string
          example: example
        tools:
          type: array
          items:
            type: string
            example: example
        accountId:
          type: number
          example: 1
        createdByUserId:
          type:
          - number
          - 'null'
          example: 1
        createdBy:
          type: object
          properties:
            id:
              type: number
              example: 1
            firstName:
              type: string
              example: example
            lastName:
              type: string
              example: example
            email:
              type: string
              example: example
            avatar:
              type:
              - string
              - 'null'
              example: example
          required:
          - id
          - firstName
          - lastName
          - email
          - avatar
        visibility:
          type: string
          enum:
          - PRIVATE
          - ACCOUNT
          example: PRIVATE
        createdAt:
          type: string
          example: example
        updatedAt:
          type: string
          example: example
        playbookConnectedAccounts:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                example: 1
              connectedAccountId:
                type: number
                example: 1
              useAllTools:
                type: boolean
                example: false
              selectedToolSlugs:
                type:
                - array
                - 'null'
                items:
                  type: string
                  example: example
              connectedAccount:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  toolkit:
                    type: string
                    example: example
                  connectedEmail:
                    type:
                    - string
                    - 'null'
                    example: example
                  alias:
                    type:
                    - string
                    - 'null'
                    example: example
                  isConnected:
                    type: boolean
                    example: false
                required:
                - id
                - toolkit
                - connectedEmail
                - alias
                - isConnected
            required:
            - id
            - connectedAccountId
            - useAllTools
            - selectedToolSlugs
        selectedRecordTypes:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              recordTypeId:
                type: number
                example: 1
              read:
                type: boolean
                example: false
              create:
                type: boolean
                example: false
              update:
                type: boolean
                example: false
              delete:
                type: boolean
                example: false
              createActivity:
                type: boolean
                example: false
            required:
            - recordTypeId
        selectedCustomTools:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              id:
                type: integer
                minimum: 1
                example: 1
              enabled:
                type: boolean
                default: true
                example: false
            required:
            - id
      required:
      - id
      - name
      - description
      - isActive
      - instructions
      - tools
      - accountId
      - createdByUserId
      - visibility
      - createdAt
      - updatedAt
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    PublicAgentPlaybookList:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                example: 1
              name:
                type: string
                example: example
              description:
                type: string
                example: example
              isActive:
                type: boolean
                example: false
              instructions:
                type: string
                example: example
              tools:
                type: array
                items:
                  type: string
                  example: example
              accountId:
                type: number
                example: 1
              createdByUserId:
                type:
                - number
                - 'null'
                example: 1
              createdBy:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  firstName:
                    type: string
                    example: example
                  lastName:
                    type: string
                    example: example
                  email:
                    type: string
                    example: example
                  avatar:
                    type:
                    - string
                    - 'null'
                    example: example
                required:
                - id
                - firstName
                - lastName
                - email
                - avatar
              visibility:
                type: string
                enum:
                - PRIVATE
                - ACCOUNT
                example: PRIVATE
              createdAt:
                type: string
                example: example
              updatedAt:
                type: string
                example: example
              playbookConnectedAccounts:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 1
                    connectedAccountId:
                      type: number
                      example: 1
                    useAllTools:
                      type: boolean
                      example: false
                    selectedToolSlugs:
                      type:
                      - array
                      - 'null'
                      items:
                        type: string
                        example: example
                    connectedAccount:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                        toolkit:
                          type: string
                          example: example
                        connectedEmail:
                          type:
                          - string
                          - 'null'
                          example: example
                        alias:
                          type:
                          - string
                          - 'null'
                          example: example
                        isConnected:
                          type: boolean
                          example: false
                      required:
                      - id
                      - toolkit
                      - connectedEmail
                      - alias
                      - isConnected
                  required:
                  - id
                  - connectedAccountId
                  - useAllTools
                  - selectedToolSlugs
              selectedRecordTypes:
                type:
                - array
                - 'null'
                items:
                  type: object
                  properties:
                    recordTypeId:
                      type: number
                      example: 1
                    read:
                      type: boolean
                      example: false
                    create:
                      type: boolean
                      example: false
                    update:
                      type: boolean
                      example: false
                    delete:
                      type: boolean
                      example: false
                    createActivity:
                      type: boolean
                      example: false
                  required:
                  - recordTypeId
              selectedCustomTools:
                type:
                - array
                - 'null'
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 1
                      example: 1
                    enabled:
                      type: boolean
                      default: true
                      example: false
                  required:
                  - id
            required:
            - id
            - name
            - description
            - isActive
            - instructions
            - tools
            - accountId
            - createdByUserId
            - visibility
            - createdAt
            - updatedAt
        total:
          type: number
          example: 1
        page:
          type: number
          example: 1
        pageSize:
          type: number
          example: 1
        totalPages:
          type: number
          example: 1
      required:
      - results
      - total
      - page
      - pageSize
      - totalPages
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
