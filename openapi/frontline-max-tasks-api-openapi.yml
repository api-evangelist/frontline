  /public/v1/max/periodic-tasks/triggers:
    get:
      summary: List available Max task triggers
      operationId: listMaxPeriodicTaskTriggers
      description: Returns the event triggers the caller can build automations on, based on which integrations they have connected. Use this before creating an event task, since the available triggers differ per user. Requires a USER API key.
