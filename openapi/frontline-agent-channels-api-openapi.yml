openapi: 3.2.0
info:
  title: Public Agent Channels API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Agent Channels
  description: View connected channel integrations (WhatsApp, Instagram, Messenger) and bind numbers/accounts/pages to agents
paths:
  /public/v1/channels:
    get:
      summary: List connected communication channels
      operationId: listChannels
      description: Read-only list of WhatsApp Business numbers, Instagram accounts, and Messenger pages connected to this account, and which agent each one is bound to. For Send WhatsApp Message nodes, use a WhatsApp number where canSendMessages is true (assistantId assigned). Connecting a channel requires the OAuth flow in the app and is not available via the API.
      security:
      - accountApiKey: []
      - userApiKey: []
      tags:
      - Agent Channels
      responses:
        '200':
          description: Connected communication channels for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicChannelsOutput'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/channels/whatsapp/flows/{flowId}/definition:
    get:
      summary: Get a WhatsApp flow definition
      operationId: getChannelWhatsappFlowDefinition
      description: Downloads flow.json from Meta using this account's WhatsApp integration. Use definition.screens[].data to build flowActionData. When Meta does not grant Flow asset access, available is false and callers should accept a raw flowActionData object instead.
      security:
      - accountApiKey: []
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Meta WhatsApp Flow ID.
          example: '1568183430948890'
        required: true
        name: flowId
        in: path
      responses:
        '200':
          description: WhatsApp Flow definition availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWhatsAppFlowDefinitionOutput'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/channels/whatsapp/templates:
    get:
      summary: List approved WhatsApp templates
      operationId: listChannelWhatsappTemplates
      description: Read-only list of APPROVED WhatsApp message templates from Meta for this account's WhatsApp Business channel. Use template.name in SEND_WHATSAPP_MESSAGE nodes and map parameters into templateVariables.
      security:
      - accountApiKey: []
      - userApiKey: []
      tags:
      - Agent Channels
      responses:
        '200':
          description: Approved WhatsApp templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWhatsAppTemplatesOutput'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: WhatsApp channel not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/channels/whatsapp/numbers/{phoneNumberId}/business-info:
    get:
      summary: Get WhatsApp number business info
      operationId: getWhatsAppNumberBusinessInfo
      description: Returns the live WhatsApp Business profile (about, address, websites, category) for a connected number. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      responses:
        '200':
          description: The WhatsApp business profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWhatsAppBusinessInfo'
  /public/v1/channels/whatsapp/{integrationId}/numbers/{phoneNumberId}:
    put:
      summary: Update WhatsApp number (profile + agent)
      operationId: updateWhatsAppNumber
      description: Updates a WhatsApp number's business profile and/or binds it to an agent. Pass `agentId` to bind, null to unbind, or omit to leave the binding unchanged. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 12
        required: true
        name: integrationId
        in: path
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicWhatsAppNumberUpdateInput'
      responses:
        '200':
          description: The updated WhatsApp number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWhatsAppNumber'
  /public/v1/channels/whatsapp/{integrationId}/numbers/{phoneNumberId}/register:
    post:
      summary: Register WhatsApp number
      operationId: registerWhatsAppNumber
      description: Registers a connected WhatsApp number with Meta (generates a PIN and completes registration). Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 12
        required: true
        name: integrationId
        in: path
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      responses:
        '204':
          description: Registered
  /public/v1/channels/whatsapp/{integrationId}/numbers/{phoneNumberId}/disconnect:
    post:
      summary: Disconnect WhatsApp number
      operationId: disconnectWhatsAppNumber
      description: Disconnects a single WhatsApp number from the integration. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 12
        required: true
        name: integrationId
        in: path
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      responses:
        '204':
          description: Disconnected
  /public/v1/channels/instagram/accounts/{instagramAccountId}:
    put:
      summary: Assign Instagram account to agent
      operationId: assignInstagramAccount
      description: Binds (or, with null, unbinds) a connected Instagram account to an agent. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 5
        required: true
        name: instagramAccountId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicChannelAssignInput'
      responses:
        '200':
          description: The updated Instagram account
  /public/v1/channels/messenger/pages/{messengerPageId}:
    put:
      summary: Assign Messenger page to agent
      operationId: assignMessengerPage
      description: Binds (or, with null, unbinds) a connected Messenger page to an agent. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 1
          example: 7
        required: true
        name: messengerPageId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicChannelAssignInput'
      responses:
        '200':
          description: The updated Messenger page
components:
  schemas:
    PublicWhatsAppTemplate:
      type: object
      properties:
        id:
          type: string
          example: example
        name:
          type: string
          description: Template name to use in SEND_WHATSAPP_MESSAGE nodes.
          example: hello_world
        language:
          type: string
          example: example
        status:
          type: string
          example: example
        category:
          type: string
          example: example
        components:
          type: array
          items:
            type: object
            additionalProperties: {}
        parameters:
          $ref: '#/components/schemas/PublicWhatsAppTemplateParameters'
      required:
      - name
    PublicWhatsAppNumber:
      type: object
      properties:
        id:
          type: number
          example: 1
        phoneNumberId:
          type: string
          example: example
        assistantId:
          type:
          - string
          - 'null'
          example: example
        assistant:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              example: example
            name:
              type: string
              example: example
          required:
          - id
          - name
        status:
          type: string
          enum:
          - CONNECTED
          - PENDING
          - UNREGISTERED
          - ERROR
          - VERIFICATION_PENDING
          - DELETED
          example: CONNECTED
        wabaId:
          type: string
          example: example
        name:
          type: string
          example: example
        about:
          type:
          - string
          - 'null'
          example: example
        description:
          type:
          - string
          - 'null'
          example: example
        address:
          type:
          - string
          - 'null'
          example: example
        category:
          type: string
          enum:
          - AUTO
          - BEAUTY
          - APPAREL
          - EDU
          - ENTERTAIN
          - EVENT_PLAN
          - FINANCE
          - GROCERY
          - GOVT
          - HOTEL
          - HEALTH
          - NONPROFIT
          - PROF_SERVICES
          - RETAIL
          - TRAVEL
          - RESTAURANT
          - OTHER
          - UNDEFINED
          example: AUTO
        displayPhoneNumber:
          type: string
          example: example
        website:
          type:
          - string
          - 'null'
          example: example
        secondaryWebsite:
          type:
          - string
          - 'null'
          example: example
        verificationStatus:
          type: string
          enum:
          - VERIFIED
          - NOT_VERIFIED
          example: VERIFIED
        image:
          type:
          - string
          - 'null'
          example: example
        email:
          type:
          - string
          - 'null'
          example: example
        createdAt:
          type: string
          example: example
        updatedAt:
          type: string
          example: example
      required:
      - id
      - phoneNumberId
      - assistantId
      - status
      - wabaId
      - name
      - about
      - description
      - address
      - category
      - displayPhoneNumber
      - website
      - secondaryWebsite
      - verificationStatus
      - image
      - email
      - createdAt
      - updatedAt
    PublicWhatsAppFlowDefinitionOutput:
      oneOf:
      - type: object
        properties:
          available:
            type: boolean
            enum:
            - true
            example: true
          flowId:
            type: string
            example: example
          definition:
            type: object
            additionalProperties: {}
        required:
        - available
        - flowId
        - definition
      - type: object
        properties:
          available:
            type: boolean
            enum:
            - false
            example: false
          flowId:
            type: string
            example: example
          reason:
            type: string
            enum:
            - integration_unavailable
            - flow_not_in_account
            - meta_permission_denied
            - integration_auth_failed
            - definition_unavailable
            - upstream_unavailable
            example: integration_unavailable
          message:
            type: string
            example: example
        required:
        - available
        - flowId
        - reason
        - message
    PublicChannelAssistant:
      type:
      - object
      - 'null'
      properties:
        id:
          type: string
          example: example
        name:
          type: string
          example: example
      required:
      - id
      - name
    PublicWhatsAppTemplatesOutput:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicWhatsAppTemplate'
      required:
      - results
    PublicChannelsOutput:
      type: object
      properties:
        whatsapp:
          type: object
          properties:
            connected:
              type: boolean
              example: false
            phoneNumbers:
              type: array
              items:
                $ref: '#/components/schemas/PublicWhatsAppPhoneNumber'
          required:
          - connected
          - phoneNumbers
          description: WhatsApp Business numbers connected to this account.
        instagram:
          type: object
          properties:
            connected:
              type: boolean
              example: false
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/PublicInstagramAccount'
          required:
          - connected
          - accounts
          description: Instagram accounts connected to this account.
        messenger:
          type: object
          properties:
            connected:
              type: boolean
              example: false
            pages:
              type: array
              items:
                $ref: '#/components/schemas/PublicMessengerPage'
          required:
          - connected
          - pages
          description: Messenger pages connected to this account.
      required:
      - whatsapp
      - instagram
      - messenger
    PublicChannelAssignInput:
      type: object
      properties:
        agentId:
          type:
          - string
          - 'null'
          example: asst_123
      required:
      - agentId
    PublicWhatsAppNumberUpdateInput:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
          maxLength: 512
          example: example
        website:
          type:
          - string
          - 'null'
          maxLength: 256
          example: example
        secondaryWebsite:
          type:
          - string
          - 'null'
          maxLength: 256
          example: example
        address:
          type:
          - string
          - 'null'
          maxLength: 256
          example: example
        email:
          type:
          - string
          - 'null'
          maxLength: 128
          format: email
          example: user@example.com
        about:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 139
          example: example
        category:
          type:
          - string
          - 'null'
          enum:
          - AUTO
          - BEAUTY
          - APPAREL
          - EDU
          - ENTERTAIN
          - EVENT_PLAN
          - FINANCE
          - GROCERY
          - GOVT
          - HOTEL
          - HEALTH
          - NONPROFIT
          - PROF_SERVICES
          - RETAIL
          - TRAVEL
          - RESTAURANT
          - OTHER
          - UNDEFINED
          example: AUTO
        agentId:
          type:
          - string
          - 'null'
          example: asst_123
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
    PublicWhatsAppBusinessInfo:
      type: object
      properties:
        about:
          type:
          - string
          - 'null'
          example: example
        address:
          type:
          - string
          - 'null'
          example: example
        description:
          type:
          - string
          - 'null'
          example: example
        email:
          type:
          - string
          - 'null'
          example: example
        profile_picture_url:
          type:
          - string
          - 'null'
          example: example
        websites:
          type:
          - array
          - 'null'
          items:
            type: string
            example: example
        vertical:
          type:
          - string
          - 'null'
          enum:
          - AUTO
          - BEAUTY
          - APPAREL
          - EDU
          - ENTERTAIN
          - EVENT_PLAN
          - FINANCE
          - GROCERY
          - GOVT
          - HOTEL
          - HEALTH
          - NONPROFIT
          - PROF_SERVICES
          - RETAIL
          - TRAVEL
          - RESTAURANT
          - OTHER
          - UNDEFINED
          example: AUTO
    PublicWhatsAppTemplateParameters:
      type: object
      properties:
        HEADER:
          type: array
          items:
            type: string
            example: example
        BODY:
          type: array
          items:
            type: string
            example: example
        FOOTER:
          type: array
          items:
            type: string
            example: example
        BUTTONS:
          type: array
          items:
            type: string
            example: example
        BUTTONS_URL:
          type: array
          items:
            type: string
            example: example
    PublicMessengerPage:
      type: object
      properties:
        id:
          type: number
          example: 1
        pageId:
          type: string
          example: example
        pageName:
          type:
          - string
          - 'null'
          example: example
        assistantId:
          type:
          - string
          - 'null'
          example: example
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
      required:
      - id
      - pageId
    PublicWhatsAppPhoneNumber:
      type: object
      properties:
        phoneNumberId:
          type: string
          description: Meta WhatsApp Business phone number ID. Use in SEND_WHATSAPP_MESSAGE nodes.
          example: '1132681309928224'
        displayPhoneNumber:
          type:
          - string
          - 'null'
          example: example
        assistantId:
          type:
          - string
          - 'null'
          example: example
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
        canSendMessages:
          type: boolean
          description: True when assistantId is assigned. Only these numbers work in Send WhatsApp Message nodes.
          example: false
      required:
      - phoneNumberId
      - canSendMessages
    PublicInstagramAccount:
      type: object
      properties:
        id:
          type: number
          example: 1
        instagramUserId:
          type: string
          example: example
        username:
          type:
          - string
          - 'null'
          example: example
        assistantId:
          type:
          - string
          - 'null'
          example: example
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
      required:
      - id
      - instagramUserId
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
