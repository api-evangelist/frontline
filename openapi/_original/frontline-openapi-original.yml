  /public/v1/agents/{agentId}/flows:
    get:
      summary: List flows for an agent
      operationId: listAgentFlows
      description: >-
        Returns a list of flows associated with a specific agent. Nodes and
        logic are excluded.
      security:
        - accountApiKey: []
        - userApiKey: []
      tags:
        - Flows
      parameters:
        - schema:
            type: string
            example: uuid-xxxx-xxxx
          required: true
          name: agentId
          in: path
        - schema:
            type: string
            enum:
              - ACTIVE
              - SUSPENDED
              - DELETED
              - DRAFT
            example: ACTIVE
          required: false
          name: status
          in: query
      responses:
        '200':
          description: A list of flows
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flow'
                required:
                  - results
                description: Standard list response
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a flow for an agent
      operationId: createAgentFlow
      description: Creates a flow and an empty graph snapshot for a specific agent.
      security:
        - userApiKey: []
      tags:
        - Flows
      parameters:
        - schema:
            type: string
            example: uuid-xxxx-xxxx
          required: true
          name: agentId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFlowCreateInput'
      responses:
        '201':
          description: Created flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/agents/{agentId}/flows/{flowId}:
    get:
      summary: Get flow details
      operationId: getAgentFlow
      description: Returns flow metadata. Pass includeNodes=true to include graph nodes.
      security:
        - accountApiKey: []
        - userApiKey: []
      tags:
        - Flows
      parameters:
        - schema:
            type: string
            example: uuid-xxxx-xxxx
          required: true
          name: agentId
          in: path
        - schema:
            type: number
            nullable: true
            example: 101
          required: false
          name: flowId
          in: path
        - schema:
            anyOf:
              - type: boolean
                example: false
              - type: string
                example: example
          required: false
          name: includeNodes
          in: query
        - schema:
            anyOf:
              - type: boolean
                example: false
              - type: string
                example: example
          required: false
          name: draft
          in: query
      responses:
        '200':
          description: Flow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a flow
      operationId: updateAgentFlow
      description: Updates flow metadata or status.
      security:
        - userApiKey: []
      tags:
        - Flows
      parameters:
        - schema:
            type: string
            example: uuid-xxxx-xxxx
          required: true
          name: agentId
          in: path
        - schema:
            type: number
            nullable: true
            example: 101
          required: false
          name: flowId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFlowUpdateInput'
      responses:
        '200':
          description: Updated flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDetail'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a flow
      operationId: deleteAgentFlow
      description: Soft deletes a flow.
      security:
        - userApiKey: []
      tags:
        - Flows
      parameters:
        - schema:
            type: string
            example: uuid-xxxx-xxxx
          required: true
          name: agentId
          in: path
        - schema:
            type: number
            nullable: true
            example: 101
          required: false
          name: flowId
          in: path
      responses:
        '204':
          description: Flow deleted
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
