              description:
                type: string
                nullable: true
                example: example
              dataType:
                type: string
                enum:
                  - STRING
                  - NUMBER
                  - DECIMAL
                  - BOOLEAN
                example: STRING
            required:
              - name
              - dataType
        headers:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                example: Authorization
              value:
                type: string
                example: Bearer {apiKey}
            required:
              - key
              - value
        queryParams:
          type: array
          nullable: true
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                example: limit
              value:
                type: string
                example: '10'
            required:
