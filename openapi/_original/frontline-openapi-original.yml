paths:
  /public/v1/objects:
    get:
      summary: List objects
      operationId: listObjects
      description: Returns every object (standard + custom) for the authenticated account.
      security:
        - bearerAuth: []
      tags:
        - Objects
      responses:
        '200':
          description: Objects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                        name:
                          type: string
                          example: example
                        display_name:
                          type: string
                          example: example
                        type:
                          type: string
                          enum:
                            - table
                            - object
                          example: table
                        custom:
                          type: boolean
                          example: false
                        created_at:
                          type: string
                          nullable: true
                          example: example
                        updated_at:
                          type: string
                          nullable: true
                          example: example
                        description:
                          type: string
                          example: example
                        emoji:
                          type: string
                          example: example
                        icon_color:
                          type: string
                          example: example
                        field_count:
                          type: number
                          example: 1
                      required:
                        - id
                        - name
                        - display_name
                        - type
                        - custom
                        - created_at
                        - updated_at
                required:
                  - ok
                  - data
