          example: 1
        isDefault:
          type: boolean
          example: false
        order:
          type: number
          example: 1
        analyticsColor:
          type: string
          nullable: true
          example: example
        externalId:
          type: string
          nullable: true
          example: example
        aiVendor:
          type: string
          example: example
        reasoningModel:
          type: boolean
          example: false
        type:
          type: string
          enum:
            - TEXT
            - TRANSCRIPTION
            - FILE_ANALYSIS
          example: TEXT
      required:
        - id
        - name
    IncomingWebhookCreateOutput:
      type: object
      properties:
        id:
          type: string
          example: clx123incomingwebhook
        name:
          type: string
          example: External CRM event
        description:
          type: string
          nullable: true
          example: Receives events from the external CRM
        url:
          type: string
          example: https://hooks.example.com/webhook/clx123incomingwebhook
        isActive:
          type: boolean
          example: true
        useAuthentication:
          type: boolean
          example: true
        createdAt:
          type: string
          example: '2024-01-01T12:00:00Z'
        updatedAt:
          type: string
          example: '2024-01-01T12:00:00Z'
        accessToken:
          type: string
          nullable: true
          example: 64-character-access-token
