components:
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: >-
        Account-level API key (GENERAL). Authenticates on behalf of the entire
        account. Use for read-only and analytics endpoints marked as
        account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: >-
        User-level API key (USER). Authenticates on behalf of a specific user.
        Required for write operations and user-owned resources. Also accepted on
        all account-level endpoints.
  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - internal_error
            - cli_outdated
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: >-
            Optional structured details. Validation errors include `{ issues:
            [...] }`.
          example:
            issues:
              - path:
                  - name
                message: String must contain at least 1 character(s)
                code: too_small
      required:
        - code
        - message
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
        - ok
        - error
    Me:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
          example: true
        data:
          type: object
          properties:
            account:
              type: object
              nullable: true
              properties:
                id:
                  type: number
                  example: 1234
                name:
                  type: string
                  example: Acme Inc.
                namespace:
                  type: string
                  example: acme
              required:
                - id
                - name
                - namespace
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: number
                  example: 56
                email:
                  type: string
                  example: you@acme.com
              required:
                - id
                - email
              description: Null for GENERAL API keys; populated for USER keys.
          required:
            - account
            - user
      required:
        - ok
        - data
    AiModel:
      type: object
      properties:
        id:
