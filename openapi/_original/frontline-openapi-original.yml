            - PUT
            - PATCH
            - DELETE
          example: GET
        url:
          type: string
          nullable: true
          example: https://api.example.com/contacts/123
        body:
          type: string
          nullable: true
          example: example
        arguments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name:
