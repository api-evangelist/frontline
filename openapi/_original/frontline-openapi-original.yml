    PublicToolCreateInput:
      type: object
      properties:
        type:
          type: string
          enum:
            - API_CALL
          default: API_CALL
          example: API_CALL
        name:
          type: string
          minLength: 1
          maxLength: 256
          example: Fetch contact
        description:
          type: string
          maxLength: 1000
          example: Fetches a contact from the external CRM
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          example: GET
        url:
          type: string
          format: uri
          example: https://api.example.com/contacts/123
        body:
          type: string
          description: >-
            Raw request body template (typically a JSON string). Interpolate
            argument values with single braces, e.g. {contactName} (not double
            braces).
          example: '{"name":"{contactName}"}'
        arguments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                example: contactId
              description:
                type: string
                minLength: 1
                example: The contact ID to fetch
              dataType:
                type: string
                enum:
                  - STRING
                  - NUMBER
                  - DECIMAL
                  - BOOLEAN
                description: >-
                  Argument type. Use STRING, NUMBER (covers decimals), or
                  BOOLEAN. DECIMAL is accepted but not shown in the app UI —
                  prefer NUMBER.
                example: STRING
            required:
              - name
              - dataType
        headers:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                example: Authorization
              value:
                type: string
                example: Bearer {apiKey}
            required:
              - key
              - value
        queryParams:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                example: limit
              value:
                type: string
                example: '10'
            required:
              - key
              - value
      required:
        - name
        - description
        - method
        - url
