  /public/v1/objects/{name}/fields/preview-formula:
    post:
      summary: Preview formula evaluation
      operationId: previewObjectFormula
      description: Previews formula evaluation on existing data. Requires a USER API key with ADMIN or OWNER role.
      security:
      - bearerAuth: []
      tags:
      - Object fields
      parameters:
      - schema:
          type: string
          minLength: 1
          example: deals
        required: true
        name: name
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                formulaMetadata:
                  type: object
                  properties:
                    applyIf:
                      type: object
                      description: Query preconditions filter
                    expression:
                      type: object
                      description: Formula expression AST. Maximum AST depth is 5 (root-to-leaf node count; root node is depth 1).
                previewFilter:
                  type: object
                  description: Filter for preview rows
                limit:
                  type: integer
                  minimum: 1
                  example: 1
              required:
              - formulaMetadata
      responses:
        '200':
          description: Formula preview evaluation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
