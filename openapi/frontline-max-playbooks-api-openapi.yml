  /public/v1/max/playbooks/{playbookId}/assignment:
    post:
      summary: Assign or unassign a Max playbook
      operationId: toggleMaxPlaybookAssignment
      description: Attaches a playbook to the caller's Max, or detaches it. An unassigned playbook still exists but has no effect on how Max behaves. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Playbooks
      parameters:
      - schema:
          type:
          - integer
          - 'null'
          example: 42
        required: false
        name: playbookId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assign:
                  type: boolean
                  example: false
              required:
              - assign
      responses:
        '200':
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      assigned:
                        type: boolean
                        example: false
                      isActive:
                        type: boolean
                        example: false
                    required:
                    - success
                    - assigned
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
