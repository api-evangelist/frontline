  /public/v1/max/meetings/search:
    get:
      summary: Search meetings by content
      operationId: searchMaxMeetings
      description: Semantic search across the AI summaries of the caller's completed meetings, ranked by relevance. Ask in natural language ('pricing objections from the Acme call') rather than by keyword. Optionally narrow by an exact date or a participant name or email. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Meetings
      parameters:
      - schema:
          type: string
          minLength: 1
          example: pricing objections from the Acme call
        required: true
        name: q
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2026-08-09'
        required: false
        name: date
        in: query
      - schema:
          type: string
          example: example
        required: false
        name: participant
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: Ranked meeting matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            meetingId:
                              type: string
                              example: example
                            title:
                              type: string
                              example: example
                            date:
                              type: string
                              example: example
                            participants:
                              type: string
                              example: example
                            platform:
                              type: string
                              example: example
                            summary:
                              type: string
                              example: example
                            score:
                              type: number
                              example: 1
                          required:
                          - meetingId
                          - title
                          - date
                          - participants
                          - platform
                          - summary
                          - score
                    required:
                    - results
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account has no Meeting Intelligence license for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/max/meetings/analytics:
    get:
      summary: Get your own meeting analytics
      operationId: getMyMeetingAnalytics
      description: Returns the caller's own meeting volume and duration, broken down by day, platform and source, plus the raw meeting list so you can bucket by hour or weekday yourself. Scoped to the caller alone — for the same report across the account, an OWNER or ADMIN can call `GET /meetings/analytics`. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Meetings
      parameters:
      - schema:
          type:
          - string
          - 'null'
          example: example
        required: false
        name: startDate
        in: query
      - schema:
          type:
          - string
          - 'null'
          example: example
        required: false
        name: endDate
        in: query
      responses:
        '200':
          description: Your meeting analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      range:
                        type: object
                        properties:
                          startDate:
                            type:
                            - string
                            - 'null'
                            example: example
                          endDate:
                            type:
                            - string
                            - 'null'
                            example: example
                        required:
                        - startDate
                        - endDate
                      scope:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - self
                            - account
                            - filtered
                            example: self
                          maxUserProfileIds:
                            type: array
                            items:
                              type: number
                              example: 1
                          userIds:
                            type: array
                            items:
                              type: number
                              example: 1
                          teamIds:
                            type: array
                            items:
                              type: number
                              example: 1
                        required:
