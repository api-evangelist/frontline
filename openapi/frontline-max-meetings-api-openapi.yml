  /public/v1/max/meetings/{meetingId}/recording/{mediaType}:
    get:
      summary: Get a recording playback URL
      operationId: getMaxMeetingRecordingUrl
      description: Returns a short-lived signed URL for the meeting's video or audio recording. The link expires, so fetch it when you are about to play or download, not ahead of time. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Meetings
      parameters:
      - schema:
          type: string
          example: cmk3f1p2a0000qx0h9y6r1s2t
        required: true
        name: meetingId
        in: path
      - schema:
          type: string
          enum:
          - video
          - audio
          example: video
        required: true
        name: mediaType
        in: path
      responses:
        '200':
          description: Signed media URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://storage.example.com/rec.mp4?sig=...
                      expiresAt:
                        type:
                        - string
                        - 'null'
                        example: '2026-08-09T12:00:00.000Z'
                    required:
                    - url
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The account has no Meeting Intelligence license for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No recording of that type exists for this meeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
