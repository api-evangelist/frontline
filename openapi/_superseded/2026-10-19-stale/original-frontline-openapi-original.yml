components:
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use
        for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for
        write operations and user-owned resources. Also accepted on all account-level endpoints.
  schemas:
    PublicChannelAssistant:
      type: object
      nullable: true
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    PublicWhatsAppPhoneNumber:
      type: object
      properties:
        phoneNumberId:
          type: string
          description: Meta WhatsApp Business phone number ID. Use in SEND_WHATSAPP_MESSAGE nodes.
          example: '1132681309928224'
        displayPhoneNumber:
          type: string
          nullable: true
        assistantId:
          type: string
          nullable: true
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
        canSendMessages:
          type: boolean
          description: True when assistantId is assigned. Only these numbers work in Send WhatsApp Message
            nodes.
      required:
      - phoneNumberId
      - canSendMessages
    PublicInstagramAccount:
      type: object
      properties:
        id:
          type: number
        instagramUserId:
          type: string
        username:
          type: string
          nullable: true
        assistantId:
          type: string
          nullable: true
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
      required:
      - id
      - instagramUserId
    PublicMessengerPage:
      type: object
      properties:
        id:
          type: number
        pageId:
          type: string
        pageName:
          type: string
          nullable: true
        assistantId:
          type: string
          nullable: true
        assistant:
          $ref: '#/components/schemas/PublicChannelAssistant'
      required:
      - id
      - pageId
    PublicChannelsOutput:
      type: object
      properties:
        whatsapp:
          type: object
          properties:
            connected:
              type: boolean
            phoneNumbers:
              type: array
              items:
                $ref: '#/components/schemas/PublicWhatsAppPhoneNumber'
          required:
          - connected
          - phoneNumbers
          description: WhatsApp Business numbers connected to this account.
        instagram:
          type: object
          properties:
            connected:
              type: boolean
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/PublicInstagramAccount'
          required:
          - connected
          - accounts
          description: Instagram accounts connected to this account.
        messenger:
          type: object
          properties:
            connected:
              type: boolean
            pages:
              type: array
              items:
                $ref: '#/components/schemas/PublicMessengerPage'
          required:
          - connected
          - pages
          description: Messenger pages connected to this account.
      required:
      - whatsapp
      - instagram
      - messenger
    PublicWhatsAppTemplateParameters:
      type: object
      properties:
        HEADER:
          type: array
          items:
            type: string
        BODY:
          type: array
          items:
            type: string
        FOOTER:
          type: array
          items:
            type: string
        BUTTONS:
          type: array
          items:
            type: string
        BUTTONS_URL:
          type: array
          items:
            type: string
    PublicWhatsAppTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Template name to use in SEND_WHATSAPP_MESSAGE nodes.
          example: hello_world
        language:
          type: string
        status:
          type: string
        category:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties:
              nullable: true
        parameters:
          $ref: '#/components/schemas/PublicWhatsAppTemplateParameters'
      required:
      - name
    PublicWhatsAppTemplatesOutput:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicWhatsAppTemplate'
      required:
      - results
    PublicConnectedAccount:
      type: object
      properties:
        id:
          type: number
          description: Connected account ID. Use as connectedAccountId in agent settings, flows, and workflows.
        toolkit:
          type: string
          example: googlesheets
        alias:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
          - PRIVATE
          - SHARED
        isConnected:
          type: boolean
        isExpired:
          type: boolean
        connectedEmail:
          type: string
          nullable: true
        connectedAt:
          type: string
          nullable: true
        availableToolsCount:
          type: number
          nullable: true
        enabledToolsCount:
          type: number
          nullable: true
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
      required:
      - id
      - toolkit
      - visibility
      - isConnected
      - isExpired
      - createdAt
      - updatedAt
    PublicIntegrationsListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicConnectedAccount'
      required:
      - results
    PublicTriggerConfigField:
      type: object
      properties:
        name:
          type: string
          description: Key to send inside triggerConfig on the TRIGGER node.
          example: folder_id
        type:
          type: string
          example: string
        description:
          type: string
        required:
          type: boolean
          description: When true, the trigger cannot be created without this config field.
        userConfigurable:
          type: boolean
          description: When false the value is managed by the platform and is ignored if you send it.
        resourceType:
          type: string
          nullable: true
          enum:
          - gmail_labels
          - googlesheets_spreadsheets
          - googlesheets_sheets
          - googledocs_documents
          - googledrive_folders
          - googledrive_shared_drives
          - onedrive_folders
          - asana_workspaces
          - asana_projects
          - salesforce_sobjects
          - salesforce_sobject_fields
          - outlook_folders
          - outlook_calendars
          description: Picker that lists valid values for this field. Call GET /public/v1/integrations/trigger-resources
            with this resourceType. Null when the value is free text.
          example: googledrive_folders
      required:
      - name
      - type
      - description
      - required
      - userConfigurable
      - resourceType
    PublicTriggerType:
      type: object
      properties:
        slug:
          type: string
          description: Send as data.triggerSlug on a COMPOSIO_TRIGGER node.
          example: GOOGLEDRIVE_FILE_CREATED_TRIGGER
        toolkit:
          type: string
          enum:
          - GMAIL
          - GOOGLECALENDAR
          - SLACK
          - CALENDLY
          - GOOGLEDOCS
          - GOOGLESHEETS
          - NOTION
          - GOOGLEDRIVE
          - GRANOLA_MCP
          - GOOGLEMEET
          - ZOOM
          - GAMMA
          - STRIPE
          - POSTHOG
          - LINKEDIN
          - FACEBOOK
          - GOOGLE_ANALYTICS
          - GOOGLE_SEARCH_CONSOLE
          - MAILCHIMP
          - SEMRUSH
          - GOOGLEADS
          - INSTAGRAM
          - ADYNTEL
          - GOOGLETASKS
          - LINEAR
          - JIRA
          - ASANA
          - SHARE_POINT
          - ONE_DRIVE
          - EXCEL
          - TIKTOK
          - TWITTER
          - YOUTUBE
          - GOOGLE_MAPS
          - METAADS
          - SHOPIFY
          - AIRTABLE
          - MONDAY
          - TRELLO
          - GOOGLESLIDES
          - BUILTWITH
          - HUBSPOT
          - PIPEDRIVE
          - ATTIO
          - ZENDESK
          - SALESFORCE
          - SALESFORCE_SERVICE_CLOUD
          - INTERCOM
          - WEBFLOW
          - FIGMA
          - APOLLO
          - OUTLOOK
          - FRESHDESK
          - ZOHO_DESK
          - ZOHO_INVOICE
          - ZOHO
          - BREX
          description: Send as data.triggerToolkit on a COMPOSIO_TRIGGER node.
          example: GOOGLEDRIVE
        name:
          type: string
          example: File Created
        description:
          type: string
        deliveryType:
          type: string
          enum:
          - POLL
          - WEBHOOK
          description: POLL triggers are checked on an interval; WEBHOOK triggers are pushed.
        configFields:
          type: array
          items:
            $ref: '#/components/schemas/PublicTriggerConfigField'
      required:
      - slug
      - toolkit
      - name
      - description
      - deliveryType
      - configFields
    PublicTriggerTypesListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicTriggerType'
      required:
      - results
    PublicTriggerResource:
      type: object
      properties:
        id:
          type: string
          description: Value to send in triggerConfig for the matching field.
        name:
          type: string
      required:
      - id
      - name
    PublicTriggerResourcesListResponse:
      type: object
      properties:
        resourceType:
          type: string
          enum:
          - gmail_labels
          - googlesheets_spreadsheets
          - googlesheets_sheets
          - googledocs_documents
          - googledrive_folders
          - googledrive_shared_drives
          - onedrive_folders
          - asana_workspaces
          - asana_projects
          - salesforce_sobjects
          - salesforce_sobject_fields
          - outlook_folders
          - outlook_calendars
        parent:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicTriggerResource'
        total:
          type: number
      required:
      - resourceType
      - parent
      - results
      - total
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
    PublicIntegration:
      type: object
      properties:
        id:
          type: number
        toolkit:
          type: string
        alias:
          type: string
          nullable: true
        visibility:
          type: string
          enum:
          - PRIVATE
          - SHARED
        isConnected:
          type: boolean
        isExpired:
          type: boolean
          default: false
        connectedEmail:
          type: string
          nullable: true
        connectedAt:
          type: string
          nullable: true
        composioConnectedAccountId:
          type: string
          nullable: true
        allowedToolSlugs:
          type: array
          nullable: true
          items:
            type: string
        availableToolsCount:
          type: number
          nullable: true
        enabledToolsCount:
          type: number
          nullable: true
        accountId:
          type: number
          nullable: true
        createdByUserId:
          type: number
          nullable: true
        createdByUser:
          type: object
          nullable: true
          properties:
            id:
              type: number
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
            avatar:
              type: string
              nullable: true
          required:
          - id
          - firstName
          - lastName
          - email
          - avatar
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
      required:
      - id
      - toolkit
      - visibility
      - isConnected
      - createdAt
      - updatedAt
    PublicIntegrationList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicIntegration'
      required:
      - results
    PublicIntegrationToolkit:
      type: object
      properties:
        toolkit:
          type: string
          example: GMAIL
        name:
          type: string
          example: Gmail
        description:
          type: string
          nullable: true
          example: Send and read email via Gmail
        authScheme:
          type: string
          example: OAUTH2
        toolCount:
          type: number
          example: 12
        tools:
          type: array
          items:
            type: string
          example:
          - GMAIL_SEND_EMAIL
      required:
      - toolkit
      - name
      - authScheme
      - toolCount
      - tools
    PublicIntegrationToolkitList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicIntegrationToolkit'
      required:
      - results
    PublicIntegrationUpdateInput:
      type: object
      properties:
        alias:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        visibility:
          type: string
          enum:
          - PRIVATE
          - SHARED
    PublicIntegrationTools:
      type: object
      properties:
        enabledTools:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              description:
                type: string
              enabled:
                type: boolean
              hasRequiredScopes:
                type: boolean
            required:
            - slug
            - name
            - description
            - enabled
            - hasRequiredScopes
        availableTools:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              name:
                type: string
              description:
                type: string
              enabled:
                type: boolean
              hasRequiredScopes:
                type: boolean
            required:
            - slug
            - name
            - description
            - enabled
            - hasRequiredScopes
      required:
      - enabledTools
      - availableTools
    PublicIntegrationSetToolsInput:
      type: object
      properties:
        slugs:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - slugs
    PublicVisualOptions:
      type: object
      properties:
        iconKeys:
          type: array
          items:
            type: string
          description: Valid icon keys for the `icon`/`emoji` field on objects and record types (the IconPicker
            set).
          example:
          - home
          - users
          - briefcase
          - rocket
        iconColors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: blue
              value:
                type: string
                example: '#60a5fa'
            required:
            - name
            - value
          description: Valid colors for an object/record-type/field `iconColor`.
        optionColors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: blue
              value:
                type: string
                example: '#60a5fa'
            required:
            - name
            - value
          description: 'Valid preset colors for tag/select option `color` (note: a different palette from
            iconColor).'
        tagModes:
          type: array
          items:
            type: string
          example:
          - singleSelect
          - multiSelect
        relationModes:
          type: array
          items:
            type: string
          example:
          - single
          - multi
      required:
      - iconKeys
      - iconColors
      - optionColors
      - tagModes
      - relationModes
    PublicFieldGuidance:
      type: object
      properties:
        guidance:
          type: string
          description: Markdown reference covering every field/column type, its metadata shape, and best
            practices — generated from the same constants the create/update schemas validate against.
      required:
      - guidance
    PublicNodeTypeList:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: TOOLS_AI
              validInFlow:
                type: boolean
                description: Usable in an agent flow (WorkflowType.FLOW).
                example: true
              validInAutomation:
                type: boolean
                description: Usable in an automation workflow (WorkflowType.AUTOMATION).
                example: true
              allowsMultipleOutgoingHandles:
                type: boolean
                description: May fan out to more than one outgoing edge.
                example: true
            required:
            - type
            - validInFlow
            - validInAutomation
            - allowsMultipleOutgoingHandles
      required:
      - results
    PublicNodeGuidance:
      type: object
      properties:
        nodeType:
          type: string
          example: TOOLS_AI
        guidance:
          type: string
          description: Markdown guidance for configuring this node type. Empty when no guidance is published
            for the type.
      required:
      - nodeType
      - guidance
    Me:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - true
          example: true
        data:
          type: object
          properties:
            account:
              type: object
              nullable: true
              properties:
                id:
                  type: number
                  example: 1234
                name:
                  type: string
                  example: Acme Inc.
                namespace:
                  type: string
                  example: acme
              required:
              - id
              - name
              - namespace
            user:
              type: object
              nullable: true
              properties:
                id:
                  type: number
                  example: 56
                email:
                  type: string
                  example: you@acme.com
              required:
              - id
              - email
              description: Null for GENERAL API keys; populated for USER keys.
          required:
          - account
          - user
      required:
      - ok
      - data
    IncomingWebhookCreateOutput:
      type: object
      properties:
        id:
          type: string
          example: clx123incomingwebhook
        name:
          type: string
          example: External CRM event
        description:
          type: string
          nullable: true
          example: Receives events from the external CRM
        url:
          type: string
          example: https://hooks.example.com/webhook/clx123incomingwebhook
        isActive:
          type: boolean
          example: true
        useAuthentication:
          type: boolean
          example: true
        createdAt:
          type: string
          example: '2024-01-01T12:00:00Z'
        updatedAt:
          type: string
          example: '2024-01-01T12:00:00Z'
        accessToken:
          type: string
          nullable: true
          example: 64-character-access-token
      required:
      - id
      - name
      - url
      - isActive
      - useAuthentication
      - createdAt
      - updatedAt
    PublicIncomingWebhookCreateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: External CRM event
        description:
          type: string
          nullable: true
          example: Receives events from the external CRM
        isActive:
          type: boolean
          default: true
          example: true
        useAuthentication:
          type: boolean
          default: true
          example: true
      required:
      - name
    PublicIncomingWebhook:
      type: object
      properties:
        id:
          type: string
          example: clx123incomingwebhook
        name:
          type: string
          example: External CRM event
        description:
          type: string
          nullable: true
