  /public/v1/integrations/trigger-resources:
    get:
      summary: List values for a trigger config field
      operationId: listIntegrationTriggerResources
      description: 'Resolves the ids a triggerConfig needs (Drive folders, Sheets spreadsheets and tabs,
        Asana workspaces and projects, Salesforce sobjects and fields, Gmail labels, Outlook folders and
        calendars, OneDrive folders). Take `resourceType` from a trigger type''s configFields, and send
        each result''s `id` as the value of that config field. `parent` is required when browsing inside
        another resource: spreadsheetId for googlesheets_sheets, workspaceGid for asana_projects, sobjectName
        for salesforce_sobject_fields, and an optional folder path for onedrive_folders. The connected
        account must belong to your account and match the resource''s toolkit. Requires a USER API key.'
      security:
      - userApiKey: []
      tags:
      - Integrations
      parameters:
      - schema:
          type: string
          enum:
          - gmail_labels
          - googlesheets_spreadsheets
          - googlesheets_sheets
          - googledocs_documents
          - googledrive_folders
          - googledrive_shared_drives
          - onedrive_folders
          - asana_workspaces
          - asana_projects
          - salesforce_sobjects
          - salesforce_sobject_fields
          - outlook_folders
          - outlook_calendars
        required: true
        name: resourceType
        in: query
