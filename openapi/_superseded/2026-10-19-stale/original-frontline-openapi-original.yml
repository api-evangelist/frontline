  /public/v1/agents/{agentId}/conversations:
    get:
      summary: List agent conversations
      operationId: listAgentConversations
      description: Lists conversations for an agent, including the latest rolling summary and linked CRM
        contact. Supports full-text search (`search`), channel and feedback filters, and date ranges.
        Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agents
      parameters:
      - schema:
          type: string
          example: uuid-xxxx-xxxx
        required: true
        name: agentId
        in: path
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        required: false
        name: is_closed
        in: query
      - schema:
          type: string
          nullable: true
          example: '2026-01-01'
        required: false
        name: start_date
        in: query
      - schema:
          type: string
          nullable: true
          example: '2026-12-31'
        required: false
        name: end_date
        in: query
      - schema:
          type: string
          description: Full-text search over message content and conversation name.
          example: refund policy
        required: false
        name: search
        in: query
      - schema:
          type: string
          description: 'Comma-separated channels to filter by. Valid values: LIVE_CHAT, SHARED, OVERVIEW,
            API, WHATSAPP, INSTAGRAM, MESSENGER, SLACK, MAX_EXTENSION, MAX_WEB, MAX_API.'
          example: WHATSAPP,API
        required: false
        name: channels
        in: query
      - schema:
          type: string
          enum:
          - POSITIVE
          - NEGATIVE
          description: 'Only conversations containing a message with this feedback rating. Valid values:
            POSITIVE, NEGATIVE.'
        required: false
        name: feedback
        in: query
      responses:
        '200':
          description: A list of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicConversation'
                required:
                - results
                description: Standard list response
  /public/v1/agents/{agentId}/conversations/{conversationId}:
    get:
      summary: Get a conversation transcript
      operationId: getAgentConversation
      description: Returns a conversation with its message transcript, latest summary, and linked CRM
        contact. By default the transcript is clean (user-facing messages only); pass `include_events=true`
        for a debug view that adds non-message events (flow enter/exit, triggered intents, tool calls,
        errors) — each carrying `audit_log_id` for trace drill-down. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agents
      parameters:
      - schema:
          type: string
          example: uuid-xxxx-xxxx
        required: true
        name: agentId
        in: path
      - schema:
          type: number
          nullable: true
          example: 42
        required: false
        name: conversationId
        in: path
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: When true, the transcript includes non-message events (flow enter/exit, triggered
            intents, tool calls, errors, etc.) alongside conversational messages. Each item carries `audit_log_id`
            for drill-down. Default false returns only user-facing messages.
        required: false
        name: include_events
        in: query
      responses:
        '200':
          description: The conversation transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConversationTranscript'
  /public/v1/agents/{agentId}/conversations/{conversationId}/messages/{messageId}/trace:
    get:
      summary: Get a message's execution trace
      operationId: getAgentMessageTrace
      description: Returns the full LLM/tool execution trace (audit log) for a single message. Look up
        audit_log_id from the conversation transcript. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agents
      parameters:
      - schema:
          type: string
          example: uuid-xxxx-xxxx
        required: true
        name: agentId
        in: path
      - schema:
          type: number
          nullable: true
          example: 42
        required: false
        name: conversationId
        in: path
      - schema:
          type: number
          nullable: true
          example: 1001
        required: false
        name: messageId
        in: path
      responses:
        '200':
          description: The message execution trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExecutionTrace'
  /public/v1/workflows/{workflowId}/logs:
    get:
      summary: List workflow run logs
      operationId: listWorkflowLogs
      description: Lists the run history (executions) of a workflow. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Workflows
      parameters:
      - schema:
          type: number
          nullable: true
          example: 501
        required: false
        name: workflowId
        in: path
      - schema:
          type: string
          enum:
          - COMPLETED
          - PENDING
          - FAILED
        required: false
        name: status
        in: query
      - schema:
          type: string
          nullable: true
          example: '2026-01-01'
        required: false
        name: start_date
        in: query
      - schema:
          type: string
          nullable: true
          example: '2026-12-31'
        required: false
        name: end_date
        in: query
      responses:
        '200':
          description: A list of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicWorkflowLog'
                required:
                - results
                description: Standard list response
  /public/v1/workflows/{workflowId}/logs/{logId}:
    get:
      summary: Get a workflow run log
      operationId: getWorkflowLog
      description: Returns one run with its per-node results. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Workflows
      parameters:
      - schema:
          type: number
          nullable: true
          example: 501
        required: false
        name: workflowId
        in: path
      - schema:
          type: number
          nullable: true
          example: 9001
        required: false
        name: logId
        in: path
      responses:
        '200':
          description: The run log with node results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorkflowLogDetail'
  /public/v1/workflows/{workflowId}/logs/{logId}/nodes/{nodeResultId}/trace:
    get:
      summary: Get a node's execution trace
      operationId: getWorkflowNodeTrace
      description: Returns the full execution trace (audit log) for a single node within a run. Look up
        the node-result id and audit_log_id from the run log. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Workflows
      parameters:
      - schema:
          type: number
          nullable: true
          example: 501
        required: false
        name: workflowId
        in: path
      - schema:
          type: number
          nullable: true
          example: 9001
        required: false
        name: logId
        in: path
      - schema:
          type: number
          nullable: true
          example: 7001
        required: false
        name: nodeResultId
        in: path
      responses:
        '200':
          description: The node execution trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicExecutionTrace'
  /public/v1/users:
    get:
      summary: List account users
      operationId: listUsers
      description: Lists the users in your account. Use to resolve user IDs for user-relation fields and
        task assignment. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserList'
  /public/v1/tasks:
    get:
      summary: List user tasks
      operationId: listTasks
      description: Lists user tasks — the account 'To-dos' inbox. Filter by `assigned_to_me`, `completed`,
        `object_name` (tasks linked to an object), or `people_ids`/`team_ids`. Each task includes assignees
        and the linked object record (if any). Requires a USER API key. Distinct from object-row tasks
        (`/objects/{object}/rows/{rowId}/tasks`) and from Max tasks.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Only tasks assigned to the calling user.
          example: 'true'
        required: false
        name: assigned_to_me
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Filter by completion state.
          example: 'false'
        required: false
        name: completed
        in: query
      - schema:
          type: string
          minLength: 1
          description: Only tasks linked to this object.
          example: companies
        required: false
        name: object_name
        in: query
      - schema:
          type: string
          description: CSV of People record IDs linked to the task.
          example: 12,15
        required: false
        name: people_ids
        in: query
      - schema:
          type: string
          description: CSV of team IDs the task is shared with.
          example: '3'
        required: false
        name: team_ids
        in: query
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUserTask'
                required:
                - results
                description: Standard list response
    post:
      summary: Create a user task
      operationId: createTask
      description: Creates a user task (to-do). Optionally link it to an object record by passing `object_name`
        + `row_id` together. `assignee_ids` are user IDs (see GET /users). Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUserTaskCreateInput'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserTask'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/tasks/{taskId}:
    get:
      summary: Get a user task
      operationId: getTask
      description: Returns a single user task by ID. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: number
          nullable: true
          example: 101
        required: false
        name: taskId
        in: path
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserTask'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a user task
      operationId: updateTask
      description: 'Updates a task. Send only the fields to change. Pass `due_date: null` to clear the
        due date, or `object_name: null` + `row_id: null` to unlink the related object record. Requires
        a USER API key.'
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: number
          nullable: true
          example: 101
        required: false
        name: taskId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUserTaskUpdateInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserTask'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a user task
      operationId: deleteTask
      description: Permanently deletes a user task. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: number
          nullable: true
          example: 101
        required: false
        name: taskId
        in: path
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: number
                required:
                - success
                - id
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/tasks/{taskId}/complete:
    post:
      summary: Complete a user task
      operationId: completeTask
      description: Marks a task as completed. Only a user assigned to the task can complete it. Requires
        a USER API key.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: number
          nullable: true
          example: 101
        required: false
        name: taskId
        in: path
      responses:
        '200':
          description: Completed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserTask'
        '400':
          description: Bad Request (not an assignee, or already completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/tasks/{taskId}/uncomplete:
    post:
      summary: Uncomplete a user task
      operationId: uncompleteTask
      description: Clears the completed state of a task. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - User Tasks
      parameters:
      - schema:
          type: number
          nullable: true
          example: 101
        required: false
        name: taskId
        in: path
      responses:
        '200':
          description: Reopened task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserTask'
  /public/v1/channels/whatsapp/numbers/{phoneNumberId}/business-info:
    get:
