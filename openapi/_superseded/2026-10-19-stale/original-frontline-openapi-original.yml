          description: The updated WhatsApp number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWhatsAppNumber'
  /public/v1/channels/whatsapp/{integrationId}/numbers/{phoneNumberId}/register:
    post:
      summary: Register WhatsApp number
      operationId: registerWhatsAppNumber
      description: Registers a connected WhatsApp number with Meta (generates a PIN and completes registration).
        Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 12
        required: true
        name: integrationId
        in: path
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      responses:
        '204':
          description: Registered
  /public/v1/channels/whatsapp/{integrationId}/numbers/{phoneNumberId}/disconnect:
    post:
      summary: Disconnect WhatsApp number
      operationId: disconnectWhatsAppNumber
      description: Disconnects a single WhatsApp number from the integration. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Agent Channels
      parameters:
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          example: 12
        required: true
        name: integrationId
        in: path
      - schema:
          type: string
          example: '109876543210123'
        required: true
        name: phoneNumberId
        in: path
      responses:
        '204':
          description: Disconnected
