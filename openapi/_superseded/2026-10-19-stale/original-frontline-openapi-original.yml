          type: integer
          minimum: 0
          exclusiveMinimum: true
        required: true
        name: connectedAccountId
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: parent
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: query
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: Values available for the requested resource type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTriggerResourcesListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
