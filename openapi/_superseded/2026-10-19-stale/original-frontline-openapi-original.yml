openapi: 3.0.0
info:
  title: Public API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer <YOUR_API_KEY>

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints
    unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also
    accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Account
  description: Inspect the identity attached to the current API key
- name: Agent Builder
  description: View and manage your AI agents across your account
- name: Flows
  description: View and manage flows associated with your agents
- name: Agents
  description: 'Agent runtime data: conversations and transcripts'
- name: Agent Playbooks
  description: Manage reusable instruction sets assigned to agents
- name: Workflows
  description: View and manage your workflows across your account
- name: Billing
  description: View billing plan details, credits, and renewal information
- name: Flow Variables
  description: Manage variables scoped to an agent's flow
- name: Workflow Variables
  description: Manage variables scoped to an automation workflow
- name: Intents
  description: Manage agent intents and training phrases
- name: AI Models
  description: Discover available AI models for agent configuration
- name: Users
  description: List account users to resolve IDs for relations and assignment
- name: User Tasks
  description: 'User tasks — the account ''To-dos'' inbox: create, list, update, complete, and delete
    tasks, optionally linked to an object record. Distinct from object-row tasks (Object tasks) and from
    Max tasks.'
- name: Custom Tools
  description: Manage custom tools — reusable HTTP/API-call integrations the account creates and assigns
    to agents, flows, and workflows. Distinct from built-in system tools and connected-integration (MCP)
    tools.
- name: Incoming Webhooks
  description: Inbound HTTPS endpoints that external systems can post events to
- name: Knowledge Bases
  description: Manage knowledge bases, their sources (URLs, website crawls), search, and agent assignment
- name: Account Integrations
  description: View account-scoped (Studio) connected integrations, discover connectable toolkits, and
    configure which tools each integration exposes to agents, flows, and workflows. These are used for
    workflows and agents, separate from Max integrations.
- name: Agent Channels
  description: View connected channel integrations (WhatsApp, Instagram, Messenger) and bind numbers/accounts/pages
    to agents
- name: Integration Resources
  description: Resolve resource IDs (spreadsheets, docs, drive folders, Asana projects, Salesforce SObjects,
    Gmail labels, Outlook folders/calendars) needed to configure event triggers. Requires a USER API key.
- name: Guidance
  description: 'Builder reference data sourced live from backend constants: valid icons, colors, and formats
    for objects/tables/fields, plus the workflow/flow node-type catalog. Use these instead of hard-coding
    allowlists.'
- name: Channels
  description: Communication channels connected to this account (WhatsApp, Instagram, Messenger)
- name: Integrations
  description: OAuth/API connected accounts for toolkits like Google Sheets, Gmail, and Slack
- name: Objects
  description: Manage CRM objects (standard and custom)
- name: Object fields
  description: Manage columns on an object
- name: Object options
  description: Manage tag/select options on object fields
- name: Object record types
  description: Categorize records inside an object
- name: Object views
  description: Saved view configurations on an object
- name: Object relations
  description: Link and unlink records across objects
- name: Object rows
  description: Read and write object records
- name: Object aggregations
  description: Per-view aggregations on objects
- name: Object activities
  description: Manual activities (notes, calls, meetings, emails) attached to object rows
- name: Object tasks
  description: Tasks attached to object rows
- name: Object files
  description: Files attached to object rows
- name: Object export
  description: Export object data as XLSX or CSV
- name: Tables
  description: Manage spreadsheet-style tables
- name: Table fields
  description: Manage columns on a table
- name: Table options
  description: Manage tag/select options on table fields
- name: Table rows
  description: Read and write table rows
- name: Table aggregations
  description: Per-view aggregations on tables
- name: Table activities
  description: Manual activities (notes, calls, meetings, emails) attached to table rows
- name: Table tasks
  description: Tasks attached to table rows
- name: Table files
  description: Files attached to table rows
- name: Table export
  description: Export table data as XLSX or CSV
