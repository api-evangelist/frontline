                                - name
                                - color
                                - order
                                - created_at
                                - updated_at
                            expression: {}
                            output_type:
                              type: string
                            apply_if: {}
                            number_config: {}
                            date_config: {}
                            string_config: {}
                          required:
                          - id
                          - name
                          - key
                          - type
                          - editable
                          - created_at
                          - updated_at
                      views:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                            type:
                              type: string
                              enum:
                              - TABLE
                              - KANBAN
                              - RECORD
                            is_default:
                              type: boolean
                            is_private:
                              type: boolean
                            record_type_id:
                              type:
                              - number
                              - 'null'
                            created_at:
                              type:
                              - string
                              - 'null'
                            updated_at:
                              type:
                              - string
                              - 'null'
                            column_order:
                              type: array
                              items:
                                type: string
                            hidden_columns:
                              type: array
                              items:
                                type: string
                            sticky_columns:
                              type: array
                              items:
                                type: string
                            grouping_field_id:
                              type: number
                            column_ordering: {}
                            title_field_id:
                              type: number
                            display_field_ids:
                              type: array
                              items:
                                type: number
                          required:
                          - id
                          - name
                          - type
                          - is_default
                          - is_private
                          - record_type_id
                          - created_at
                          - updated_at
                      record_types:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                            display_name:
                              type: string
                            is_default:
                              type: boolean
                            single_noun:
                              type: string
                            emoji:
