openapi: 3.2.0
info:
  title: Public Objects API
  version: 1.0.0
  description: Public API for accessing agents, flows, and analytics.
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Objects
  description: Manage CRM objects (standard and custom)
paths:
  /public/v1/objects:
    get:
      summary: List objects
      operationId: listObjects
      description: Returns every object (standard + custom) for the authenticated account.
      security:
      - bearerAuth: []
      tags:
      - Objects
      responses:
        '200':
          description: Objects list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        display_name:
                          type: string
                        type:
                          type: string
                          enum:
                          - table
                          - object
                        custom:
                          type: boolean
                        created_at:
                          type:
                          - string
                          - 'null'
                        updated_at:
                          type:
                          - string
                          - 'null'
                        description:
                          type: string
                        emoji:
                          type: string
                        icon_color:
                          type: string
                        field_count:
                          type: number
                      required:
                      - id
                      - name
                      - display_name
                      - type
                      - custom
                      - created_at
                      - updated_at
                required:
                - ok
                - data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create object
      operationId: createObject
      description: Creates a custom object. At least one column is required. Requires a USER API key.
      security:
      - bearerAuth: []
      tags:
      - Objects
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                displayName:
                  type: string
                  minLength: 1
                emoji:
                  type: string
                icon_color:
                  type: string
                iconColor:
                  type: string
                description:
                  type: string
                columns:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                      type:
                        anyOf:
                        - type: string
                          enum:
                          - string
                          - number
                          - boolean
                          - date
                          - tags
                          - relation
                          - autoIncrement
                          - dateOnly
                          - prismaRelation
                          - kanbanViewOrder
                          - file
                          - avatar
                          - permissions
                          - formula
                        - type: string
                          enum:
                          - select
                      metadata:
                        type: object
                        additionalProperties: {}
                      record_type_id:
                        type: integer
                        exclusiveMinimum: 0
                      recordTypeId:
                        type: integer
                        exclusiveMinimum: 0
                    required:
                    - name
                    - type
                    additionalProperties: false
                  minItems: 1
              required:
              - name
              - displayName
              - columns
      responses:
        '201':
          description: Created object
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                      display_name:
                        type: string
                      type:
                        type: string
                        enum:
                        - table
                        - object
                      custom:
                        type: boolean
                      created_at:
                        type:
                        - string
                        - 'null'
                      updated_at:
                        type:
                        - string
                        - 'null'
                      description:
                        type: string
                      emoji:
                        type: string
                      icon_color:
                        type: string
                      field_count:
                        type: number
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                            key:
                              type: string
                            type:
                              type: string
                            editable:
                              type: boolean
                            created_at:
                              type:
                              - string
                              - 'null'
                            updated_at:
                              type:
                              - string
                              - 'null'
                            read_only:
                              type: boolean
                            required:
                              type: boolean
                            unique:
                              type: boolean
                            is_system:
                              type: boolean
                            is_predefined:
                              type: boolean
                            default_value: {}
                            format:
                              type: string
                            mode:
                              type: string
                              enum:
                              - singleSelect
                              - multiSelect
                              - single
                              - multi
                            timezone:
                              type: string
                            decimals:
                              type: number
                            currency:
                              type: string
                            min:
                              type:
                              - number
                              - 'null'
                            max:
                              type:
                              - number
                              - 'null'
                            time_format:
                              type: string
                            show_preview:
                              type: boolean
                            allowed_file_types:
                              type: array
                              items:
                                type: string
                            max_file_size:
                              type: number
                            related_table_id:
                              type: number
                            related_record_type_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type: number
                            display_field_id:
                              type: number
                            relation_mode:
                              type: string
                            include_activity:
                              type: boolean
                            metadata:
                              type: object
                              additionalProperties: {}
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: number
                                  name:
                                    type: string
                                  color:
                                    type: string
                                  order:
                                    type: number
                                  created_at:
                                    type:
                                    - string
