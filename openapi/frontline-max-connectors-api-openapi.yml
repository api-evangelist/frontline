openapi: 3.2.0
info:
  title: Public Max Connectors API
  version: 1.0.0
  description: 'Public API for accessing agents, flows, and analytics.


    ## Authentication


    The Public API supports two API key types. Pass the key as a Bearer token:


    ```

    Authorization: Bearer

    ```


    ### Account API key (GENERAL)


    Account-level key that acts on behalf of the entire account. Required for account-level endpoints unless noted otherwise.


    ### User API key (USER)


    User-level key tied to a specific user. Required for write operations and user-owned resources. **Also accepted on all account-level endpoints.**


    Each operation documents which key type(s) it accepts in its **Security** section.'
  license:
    name: Proprietary
    url: https://www.getfrontline.ai/terms-and-conditions
servers:
- url: https://prod-api.getfrontline.ai
tags:
- name: Max Connectors
  description: 'The calling user''s own connected accounts — called ''my connectors'' in the app, and `integrations` in these URLs. Read-only: list and inspect connection health and enabled tools. Connecting, disconnecting, and which tools Max may use are changed in the app only — not via an API key. Distinct from Workspace Connectors, which the whole account shares.'
paths:
  /public/v1/max/integrations:
    get:
      summary: List Max integrations
      operationId: listMaxIntegrations
      description: Returns the calling user's personal connected accounts — the mailboxes, calendars, and other services Max can act on for them. Users often call these 'my connectors'. These are distinct from the account-wide integrations under `/integrations`, which users may call 'workspace connectors'. Read-only — connecting, disconnecting, and which tools are enabled are changed in the app only — not via an API key. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Connectors
      responses:
        '200':
          description: Connected integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                        toolkit:
                          type: string
                          example: example
                        connectedEmail:
                          type:
                          - string
                          - 'null'
                          example: example
                        isConnected:
                          type: boolean
                          example: false
                        isExpired:
                          type: boolean
                          default: false
                          example: false
                        createdAt:
                          type:
                          - string
                          - 'null'
                          example: example
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          example: example
                        allowedToolSlugs:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                            example: example
                        allowedScopes:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                            example: example
                        availableToolsCount:
                          type:
                          - number
                          - 'null'
                          example: 1
                        enabledToolsCount:
                          type:
                          - number
                          - 'null'
                          example: 1
                      required:
                      - id
                      - toolkit
                      - isConnected
                      - createdAt
                      - updatedAt
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/v1/max/integrations/{integrationId}:
    get:
      summary: Get a Max integration
      operationId: getMaxIntegration
      description: Returns one personal connected account with its connection health and which of its tools are enabled for Max. An expired integration needs to be reconnected in the app before Max can use it again. Read-only — tool selection and reconnect are changed in the app only — not via an API key. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Connectors
      parameters:
      - schema:
          type:
          - integer
          - 'null'
          example: 42
        required: false
        name: integrationId
        in: path
      responses:
        '200':
          description: Integration detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 1
                      toolkit:
                        type: string
                        example: example
                      connectedEmail:
                        type:
                        - string
                        - 'null'
                        example: example
                      isConnected:
                        type: boolean
                        example: false
                      isExpired:
                        type: boolean
                        default: false
                        example: false
                      createdAt:
                        type:
                        - string
                        - 'null'
                        example: example
                      updatedAt:
                        type:
                        - string
                        - 'null'
                        example: example
                      allowedToolSlugs:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                          example: example
                      allowedScopes:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                          example: example
                      availableToolsCount:
                        type:
                        - number
                        - 'null'
                        example: 1
                      enabledToolsCount:
                        type:
                        - number
                        - 'null'
                        example: 1
                    required:
                    - id
                    - toolkit
                    - isConnected
                    - createdAt
                    - updatedAt
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          enum:
          - bad_request
          - unauthorized
          - forbidden
          - not_found
          - conflict
          - internal_error
          - cli_outdated
          - upgrade_required
          example: unauthorized
        message:
          type: string
          example: Detailed error message
        details:
          type: object
          description: 'Optional structured details. Validation errors include `{ issues: [...] }`.'
          example:
            issues:
            - path:
              - name
              message: String must contain at least 1 character(s)
              code: too_small
      required:
      - code
      - message
    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - false
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - ok
      - error
  securitySchemes:
    accountApiKey:
      type: http
      scheme: bearer
      bearerFormat: Account API Key
      description: Account-level API key (GENERAL). Authenticates on behalf of the entire account. Use for read-only and analytics endpoints marked as account-level in this documentation.
    userApiKey:
      type: http
      scheme: bearer
      bearerFormat: User API Key
      description: User-level API key (USER). Authenticates on behalf of a specific user. Required for write operations and user-owned resources. Also accepted on all account-level endpoints.
