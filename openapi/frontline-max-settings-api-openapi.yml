  /public/v1/max/settings/scheduling:
    get:
      summary: Get the Max scheduling settings
      operationId: getMaxSchedulingSettings
      description: 'Returns the meeting-booking preferences Max uses when it schedules on the caller''s behalf: default duration and buffers, working hours, and the scheduling links it can share. Requires a USER API key.'
      security:
      - userApiKey: []
      tags:
      - Max Settings
      responses:
        '200':
          description: Scheduling settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      schedulingEnabled:
                        type: boolean
                        example: false
                      schedulingInstructions:
                        type:
                        - string
                        - 'null'
                        example: example
                      timezone:
                        type:
                        - string
                        - 'null'
                        example: example
                      schedulingLinks:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              example: 1
                            link:
                              type: string
                              example: example
                            description:
                              type:
                              - string
                              - 'null'
                              example: example
                            isActive:
                              type: boolean
                              example: false
                            createdAt:
                              type: string
                              example: example
                            updatedAt:
                              type: string
                              example: example
                          required:
                          - id
                          - link
                          - description
                          - isActive
                          - createdAt
                          - updatedAt
                    required:
                    - schedulingEnabled
                    - schedulingInstructions
                    - timezone
                    - schedulingLinks
                required:
                - ok
                - data
        '401':
          description: Unauthorized — a USER API key is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update the Max scheduling settings
      operationId: updateMaxSchedulingSettings
      description: Updates the calling user's meeting-booking preferences and scheduling instructions. Only the fields you send are changed. Requires a USER API key.
      security:
      - userApiKey: []
      tags:
      - Max Settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                schedulingEnabled:
                  type: boolean
                  example: false
                schedulingInstructions:
                  type:
                  - string
                  - 'null'
                  maxLength: 2000
                  example: example
                timezone:
                  type: string
                  example: example
                schedulingLinks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type:
                        - number
                        - 'null'
                        example: 1
                      link:
                        type: string
                        format: uri
                        example: https://api.example.com/contacts/123
                      description:
                        type:
                        - string
                        - 'null'
                        minLength: 1
                        maxLength: 100
                        example: example
                      isActive:
                        type: boolean
                        default: true
                        example: false
                    required:
                    - link
                  maxItems: 5
      responses:
        '200':
          description: Updated scheduling settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      schedulingEnabled:
                        type: boolean
                        example: false
                      schedulingInstructions:
                        type:
                        - string
                        - 'null'
                        example: example
                      timezone:
                        type:
                        - string
                        - 'null'
                        example: example
                      schedulingLinks:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: number
                              example: 1
                            link:
                              type: string
                              example: example
                            description:
                              type:
                              - string
                              - 'null'
                              example: example
                            isActive:
                              type: boolean
                              example: false
                            createdAt:
                              type: string
                              example: example
                            updatedAt:
