  /public/v1/max/settings/advanced:
    get:
      summary: Get the Max general settings
      operationId: getMaxAdvancedSettings
      description: 'Returns how Max behaves and speaks for the calling user: language, personality, timezone, and the free-form custom instructions it follows. Requires a USER API key.'
      security:
      - userApiKey: []
      tags:
      - Max Settings
      responses:
        '200':
          description: General settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    type: object
                    properties:
                      preferredLanguage:
                        type: string
                        enum:
                        - ENGLISH
                        - SPANISH
                        - PORTUGUESE
                        - FRENCH
                        - GERMAN
                        - ITALIAN
                        example: ENGLISH
                      instructions:
                        type:
                        - string
                        - 'null'
                        example: example
                      slackPreApprovePlans:
                        type: boolean
                        example: false
                      whatsAppPreApprovePlans:
                        type: boolean
                        example: false
                      slackAuthorizationMode:
                        type: string
                        enum:
                        - AUTO
                        - SUPERVISED
