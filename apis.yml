image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/frontline.png
name: Frontline
description: >-
  Frontline is an AI-native CRM platform that builds and maintains itself. It unifies customer
  context from WhatsApp, email, and meetings, ships AI agents (Max) that draft replies, proposals,
  follow-ups and meeting notes, and a Studio for building an AI workforce for sales and support.
  The Frontline Public API exposes agents, agent-builder flows, automation workflows, CRM objects
  and rows, tables, tools, intents, AI models, incoming webhooks, account, and billing over REST at
  https://prod-api.getfrontline.ai/public/v1, authenticated with GENERAL (account) and USER Bearer
  API keys. Backed by 500 Global.
url: https://raw.githubusercontent.com/api-evangelist/frontline/refs/heads/main/apis.yml
